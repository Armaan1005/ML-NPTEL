<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ML Revision</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<style>
/* Layout: iOS-style app shell. Home = summary widget, 2x2 control tiles, week cards grid. Quiz = translucent nav, tappable progress strip, option cards, floating action bar. */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --raised:#FFFFFF; --label:#0B0B0F; --label2:#6B6B76; --label3:#AEAEB6;
  --sep:rgba(60,60,67,.14); --fill:rgba(118,118,128,.10); --fill2:rgba(118,118,128,.18);
  --blue:#0A7AFF; --green:#28B455; --red:#F2382C; --orange:#FF8A00; --indigo:#5856D6; --teal:#1EA5C4; --pink:#F2316B;
  --green-bg:rgba(40,180,85,.11); --red-bg:rgba(242,56,44,.09); --blue-bg:rgba(10,122,255,.09);
  --bar:rgba(246,246,250,.78);
  --shadow:0 1px 2px rgba(15,15,30,.04), 0 6px 20px rgba(15,15,30,.05);
  --shadow-hi:0 2px 4px rgba(15,15,30,.06), 0 12px 32px rgba(15,15,30,.10);
  --display:"Plus Jakarta Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
  --text:"Figtree", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --mono:ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1B1D24; --card:#262933; --raised:#2F3340; --label:#F3F4F8; --label2:#A6A9B6; --label3:#6E7280;
  --sep:rgba(255,255,255,.10); --fill:rgba(150,155,175,.16); --fill2:rgba(150,155,175,.26);
  --blue:#2D8CFF; --green:#34D364; --red:#FF5147; --orange:#FF9F0A; --indigo:#7A78FF; --teal:#3CC6E3; --pink:#FF4F83;
  --green-bg:rgba(52,211,100,.14); --red-bg:rgba(255,81,71,.14); --blue-bg:rgba(45,140,255,.16);
  --bar:rgba(30,32,40,.80);
  --shadow:0 0 0 1px rgba(255,255,255,.05), 0 4px 14px rgba(0,0,0,.18); --shadow-hi:0 0 0 1px rgba(255,255,255,.08), 0 12px 32px rgba(0,0,0,.35);
  color-scheme: dark;
}}
:root[data-theme="dark"]{
  --bg:#1B1D24; --card:#262933; --raised:#2F3340; --label:#F3F4F8; --label2:#A6A9B6; --label3:#6E7280;
  --sep:rgba(255,255,255,.10); --fill:rgba(150,155,175,.16); --fill2:rgba(150,155,175,.26);
  --blue:#2D8CFF; --green:#34D364; --red:#FF5147; --orange:#FF9F0A; --indigo:#7A78FF; --teal:#3CC6E3; --pink:#FF4F83;
  --green-bg:rgba(52,211,100,.14); --red-bg:rgba(255,81,71,.14); --blue-bg:rgba(45,140,255,.16);
  --bar:rgba(30,32,40,.80);
  --shadow:0 0 0 1px rgba(255,255,255,.05), 0 4px 14px rgba(0,0,0,.18); --shadow-hi:0 0 0 1px rgba(255,255,255,.08), 0 12px 32px rgba(0,0,0,.35);
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg); color:var(--label); font-family:var(--text); font-size:16px; line-height:1.45; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; -webkit-tap-highlight-color:transparent}
button{font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; text-align:inherit}
button:focus-visible, label:focus-within{outline:3px solid color-mix(in srgb, var(--blue) 50%, transparent); outline-offset:2px}
[hidden]{display:none!important}
#app{min-height:100vh; min-height:100dvh; display:flex; flex-direction:column}
.wrap{flex:1; width:100%; max-width:760px; margin:0 auto; padding-inline:16px; padding-block:0 48px}
.num{font-variant-numeric:tabular-nums}
.fade{animation:fade .28s cubic-bezier(.2,.7,.3,1)}
@keyframes fade{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}
@media (prefers-reduced-motion: reduce){ *{transition:none!important; animation:none!important} }

/* ---------- home ---------- */
.hero{padding-block:28px 4px; display:flex; align-items:flex-end; justify-content:space-between; gap:12px}
.eyebrow{font-size:12.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--label2)}
h1{font-family:var(--display); font-weight:800; font-size:clamp(32px, 7vw, 40px); line-height:1.05; letter-spacing:-.025em; margin:6px 0 0; text-wrap:balance}
.course-tag{font-size:12.5px; font-weight:600; color:var(--label2); background:var(--card); box-shadow:var(--shadow); padding:6px 10px; border-radius:999px; white-space:nowrap}

.summary{margin-top:20px; background:var(--card); border-radius:22px; box-shadow:var(--shadow); padding:18px; display:flex; gap:18px; align-items:center}
.summary .big-ring{width:92px; height:92px; flex:none}
.summary-main{flex:1; min-width:0}
.summary-title{font-family:var(--display); font-weight:700; font-size:20px; letter-spacing:-.01em}
.summary-sub{color:var(--label2); font-size:14px; margin-top:2px}
.metrics{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap}
.metric{background:var(--fill); border-radius:12px; padding:7px 11px; min-width:84px}
.metric b{display:block; font-family:var(--display); font-weight:700; font-size:18px; line-height:1.15}
.metric span{font-size:12px; color:var(--label2)}

.tiles{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:12px}
.tile{background:var(--card); border-radius:18px; box-shadow:var(--shadow); padding:14px; display:flex; flex-direction:column; gap:10px; min-height:112px; transition:transform .12s, box-shadow .2s; position:relative}
.tile:active{transform:scale(.97)}
.tile[disabled]{cursor:default; opacity:.55}
.tile[disabled]:active{transform:none}
.tile .ic{width:34px; height:34px; border-radius:50%; display:grid; place-items:center; color:#fff}
.tile .ic svg{width:18px; height:18px}
.tile b{font-family:var(--display); font-weight:700; font-size:15.5px; letter-spacing:-.005em; line-height:1.2}
.tile small{display:block; font-size:12.5px; color:var(--label2); margin-top:2px; line-height:1.3}
.tile .corner{position:absolute; top:14px; right:14px; font-family:var(--display); font-weight:700; font-size:15px}
.switch{position:absolute; top:14px; right:14px; width:44px; height:27px}
.switch i{position:absolute; inset:0; background:var(--fill2); border-radius:999px; transition:background .2s}
.switch i::after{content:""; position:absolute; top:2px; left:2px; width:23px; height:23px; border-radius:50%; background:#fff; box-shadow:0 2px 6px rgba(0,0,0,.18); transition:transform .22s cubic-bezier(.3,.7,.4,1)}
.tile.on .switch i{background:var(--green)}
.tile.on .switch i::after{transform:translateX(17px)}

.sec-h{display:flex; align-items:baseline; justify-content:space-between; gap:10px; padding:30px 4px 10px}
.sec-h h2{font-family:var(--display); font-weight:800; font-size:22px; letter-spacing:-.02em; margin:0}
.sec-h span{font-size:13px; color:var(--label2)}

.weeks{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:12px}
.wk{background:var(--card); border-radius:20px; box-shadow:var(--shadow); padding:16px; display:flex; flex-direction:column; gap:12px; min-width:0}
.wk-top{display:flex; gap:12px; align-items:center}
.wk-num{width:42px; height:42px; border-radius:13px; flex:none; display:grid; place-items:center; font-family:var(--display); font-weight:800; font-size:18px; color:var(--c); background:color-mix(in srgb, var(--c) 14%, transparent)}
.wk-label{font-size:11.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--c)}
.wk h3{font-family:var(--display); font-weight:700; font-size:17px; letter-spacing:-.01em; line-height:1.2; margin:1px 0 0; text-wrap:balance}
.wk-sub{font-size:13.5px; color:var(--label2); margin:0; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; line-height:1.4; min-height:2.8em}
.wk-bar{height:6px; border-radius:3px; background:var(--fill); overflow:hidden}
.wk-bar i{display:block; height:100%; border-radius:3px; transition:width .4s}
.wk-actions{display:flex; flex-wrap:wrap; gap:8px}
.chip{flex:1 0 auto; display:flex; align-items:center; justify-content:space-between; gap:8px; height:42px; padding:0 7px 0 14px; border-radius:13px; font-family:var(--display); font-size:14px; font-weight:700; letter-spacing:-.005em; background:var(--fill2); color:var(--label); transition:transform .1s, filter .15s; white-space:nowrap}
.chip:hover{filter:brightness(1.08)}
.chip:active{transform:scale(.97)}
.chip.primary{background:var(--c); color:#fff; box-shadow:0 4px 12px color-mix(in srgb, var(--c) 28%, transparent)}
.chip .meta{flex:none; font-family:var(--text); font-weight:700; font-size:12px; line-height:1; padding:6px 8px; border-radius:8px; background:var(--fill); color:var(--label2)}
.chip.primary .meta{background:rgba(255,255,255,.22); color:#fff}
.chip .meta.good{background:var(--green); color:#fff} .chip .meta.mid{background:var(--orange); color:#fff} .chip .meta.bad{background:var(--red); color:#fff}
.chip.primary .meta.good, .chip.primary .meta.mid, .chip.primary .meta.bad{background:#fff}
.chip.primary .meta.good{color:var(--green)} .chip.primary .meta.mid{color:var(--orange)} .chip.primary .meta.bad{color:var(--red)}
.chip-solo{flex:1}

.foot{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-top:28px; padding:0 4px; font-size:13px; color:var(--label2)}
.foot button{color:var(--red); font-weight:600; font-size:14px; padding:8px 0}

/* ---------- quiz ---------- */
.nav{position:sticky; top:0; z-index:20; background:var(--bar); backdrop-filter:saturate(180%) blur(22px); -webkit-backdrop-filter:saturate(180%) blur(22px); border-bottom:.5px solid var(--sep); padding-top:env(safe-area-inset-top,0px)}
.nav-in{max-width:760px; margin:0 auto; min-height:54px; padding-inline:8px; display:grid; grid-template-columns:minmax(80px,1fr) auto minmax(80px,1fr); align-items:center}
.nav-title{text-align:center; min-width:0; overflow:hidden}
.nav-title b{display:block; font-family:var(--display); font-weight:700; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.nav-title small{display:block; font-size:12px; color:var(--label2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:50vw; margin-inline:auto}
.nav-btn{color:var(--blue); font-size:16px; font-weight:500; display:inline-flex; align-items:center; gap:3px; padding:8px; border-radius:10px}
.nav-btn:active{opacity:.4}
.nav-btn svg{width:11px; height:19px}
.nav-right{justify-self:end}

.strip{display:flex; flex-wrap:wrap; gap:4px; margin-top:16px}
.strip button{flex:1 0 14px; max-width:44px; height:6px; border-radius:3px; background:var(--fill2); transition:background .2s, transform .15s}
.strip button:hover{transform:scaleY(1.6)}
.strip button.ok{background:var(--green)} .strip button.no{background:var(--red)} .strip button.seen{background:var(--label3)}
.strip button.cur{background:var(--blue); transform:scaleY(1.6)}
.linebar{height:6px; border-radius:3px; background:var(--fill2); overflow:hidden; margin-top:16px; display:flex}
.linebar i{display:block; height:100%}

.qhead{display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:18px}
.qno{font-family:var(--display); font-weight:800; font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:var(--blue)}
.qno span{color:var(--label3)}
.pill{display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600; padding:4px 10px; border-radius:999px; background:var(--card); box-shadow:var(--shadow); color:var(--label2)}
.pill.multi{background:var(--blue-bg); color:var(--blue); box-shadow:none}
.pill svg{width:12px; height:12px}

.qcard{background:var(--card); border-radius:22px; box-shadow:var(--shadow); padding:20px; margin-top:10px; font-size:18px; line-height:1.55; font-weight:500; letter-spacing:-.003em; overflow-wrap:anywhere}
.qcard img, .opt img{display:block; max-width:100%; height:auto; background:#fff; border-radius:10px; margin:12px 0; padding:6px; box-shadow:0 0 0 1px var(--sep)}
.qcard a{color:var(--blue)}
.katex{font-size:1.04em}
.katex-display{margin:.5em 0; overflow-x:auto; overflow-y:hidden; padding-block:2px}

.opts{display:flex; flex-direction:column; gap:10px; margin-top:14px}
.opt{display:flex; align-items:flex-start; gap:13px; width:100%; background:var(--card); border-radius:18px; box-shadow:var(--shadow); padding:15px 16px; border:2px solid transparent; transition:background .15s, border-color .15s, transform .12s, box-shadow .2s; font-size:16px; line-height:1.5}
.opt:not([disabled]):hover{box-shadow:var(--shadow-hi)}
.opt:not([disabled]):active{transform:scale(.985)}
.opt[disabled]{cursor:default}
.opt .key{flex:none; width:30px; height:30px; border-radius:50%; display:grid; place-items:center; background:var(--fill); color:var(--label2); font-family:var(--display); font-size:14px; font-weight:700; transition:background .15s,color .15s; margin-top:-2px}
.opt.multi .key{border-radius:9px}
.opt .body{flex:1; min-width:0; overflow-wrap:anywhere; overflow-x:auto}
.opt .mark{flex:none; width:22px; height:22px; margin-top:1px}
.opt.sel{border-color:var(--blue); background:var(--blue-bg); box-shadow:none}
.opt.sel .key{background:var(--blue); color:#fff}
.opt.right{border-color:var(--green); background:var(--green-bg); box-shadow:none}
.opt.right .key{background:var(--green); color:#fff}
.opt.wrong{border-color:var(--red); background:var(--red-bg); box-shadow:none}
.opt.wrong .key{background:var(--red); color:#fff}
.opt.missed{border-color:var(--green); border-style:dashed; box-shadow:none}
.opt.missed .key{background:var(--green); color:#fff}
.opt.dim{opacity:.6}

.feedback{margin-top:14px; border-radius:18px; padding:14px 16px; font-size:15px; display:flex; gap:12px; align-items:center; animation:pop .3s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0; transform:translateY(6px) scale(.98)} to{opacity:1; transform:none}}
.feedback .fi{flex:none; width:34px; height:34px; border-radius:50%; display:grid; place-items:center; color:#fff}
.feedback .fi svg{width:18px; height:18px}
.feedback b{display:block; font-family:var(--display); font-weight:700; font-size:16px}
.feedback span{color:var(--label2); font-size:14px}
.feedback.ok{background:var(--green-bg)} .feedback.ok .fi{background:var(--green)} .feedback.ok b{color:var(--green)}
.feedback.no{background:var(--red-bg)} .feedback.no .fi{background:var(--red)} .feedback.no b{color:var(--red)}
.feedback.key{background:var(--blue-bg)} .feedback.key .fi{background:var(--blue)} .feedback.key b{color:var(--blue)}
.reveal{display:inline-flex; align-items:center; gap:6px; color:var(--blue); font-size:15px; font-weight:600; padding:12px 4px 0}
.reveal:active{opacity:.4}
.reveal svg{width:16px; height:16px}
.tools{display:flex; gap:20px; flex-wrap:wrap}
.explain, .hintbox{margin-top:12px; border-radius:18px; padding:14px 16px; background:var(--card); box-shadow:var(--shadow); font-size:15.5px; line-height:1.55}
.hintbox{background:color-mix(in srgb, var(--orange) 10%, var(--card)); box-shadow:none}
.ex-h{display:flex; align-items:center; gap:7px; font-family:var(--display); font-weight:700; font-size:13px; letter-spacing:.04em; text-transform:uppercase; color:var(--orange); margin-bottom:6px}
.ex-h svg{width:17px; height:17px}
.ex-b{overflow-wrap:anywhere; overflow-x:auto}
.ex-hint{margin-top:10px; padding-top:10px; border-top:.5px solid var(--sep); font-size:14px; color:var(--label2); overflow-wrap:anywhere}
.ex-hint b{color:var(--label); font-weight:600; margin-right:4px}
.hint{font-size:12.5px; color:var(--label2); text-align:center; margin-top:22px}
.kbd{font-family:var(--mono); font-size:11.5px; padding:1px 6px; border-radius:6px; background:var(--card); box-shadow:var(--shadow); color:var(--label2)}

.actionbar{position:sticky; bottom:0; z-index:15; padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px)); pointer-events:none}
.actionbar-in{pointer-events:auto; max-width:728px; margin:0 auto; display:flex; gap:8px; padding:8px; border-radius:24px; background:var(--bar); backdrop-filter:saturate(180%) blur(22px); -webkit-backdrop-filter:saturate(180%) blur(22px); box-shadow:var(--shadow-hi)}
.btn{height:50px; border-radius:17px; font-family:var(--display); font-size:16.5px; font-weight:700; letter-spacing:-.005em; padding:0 18px; display:inline-flex; align-items:center; justify-content:center; gap:8px; transition:opacity .15s, transform .1s, background .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--blue); color:#fff; flex:1}
.btn.primary.go-green{background:var(--green)}
.btn.primary[disabled]{background:var(--fill2); color:var(--label3); cursor:default; transform:none}
.btn.icon{width:50px; padding:0; background:var(--fill); color:var(--label)}
.btn.icon[disabled]{color:var(--label3); cursor:default; transform:none}
.btn.secondary{background:var(--card); color:var(--blue); box-shadow:var(--shadow); width:100%}
.btn svg{width:18px; height:18px}

/* ---------- results ---------- */
.result{background:var(--card); border-radius:26px; box-shadow:var(--shadow); padding:28px 20px 24px; margin-top:22px; text-align:center}
.result svg{width:150px; height:150px}
.result h2{font-family:var(--display); font-weight:800; font-size:28px; letter-spacing:-.02em; margin:14px 0 4px}
.result p{margin:0; color:var(--label2); font-size:15px}
.result .tally{display:flex; justify-content:center; gap:8px; margin-top:16px; flex-wrap:wrap}
.result .tally span{font-size:13px; font-weight:600; padding:6px 12px; border-radius:999px}
.stack{display:flex; flex-direction:column; gap:10px; margin-top:14px}
.miss{display:flex; gap:12px; align-items:center; width:100%; background:var(--card); box-shadow:var(--shadow); border-radius:16px; padding:12px 14px; margin-top:8px}
.miss:active{transform:scale(.99)}
.miss .wk-num{width:34px; height:34px; border-radius:10px; font-size:14px}
.miss .t{flex:1; min-width:0}
.miss .t b{display:block; font-size:13px; font-weight:700; color:var(--label2)}
.miss .t span{display:block; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.chev-r{width:8px; height:13px; color:var(--label3); flex:none}

@media (max-width:640px){
  .tiles{grid-template-columns:repeat(2,1fr)}
  .weeks{grid-template-columns:1fr}
  .hint{display:none}
  .course-tag{display:none}
  .summary{padding:16px; gap:14px}
  .summary .big-ring{width:78px; height:78px}
  .qcard{font-size:17px; padding:18px}
}

/* ---------- desktop: spread horizontally ---------- */
@media (min-width:1000px){
  .wrap, .nav-in{max-width:1240px}
  .wrap{padding-inline:32px}
  .actionbar-in{max-width:1176px}
  .home{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.15fr); column-gap:16px; align-content:start}
  .home > .hero, .home > .sec-h, .home > .weeks, .home > .foot{grid-column:1 / -1}
  .home > .summary{margin-top:20px; height:auto}
  .home > .tiles{margin-top:20px; grid-template-columns:repeat(4,1fr)}
  .home .tile{min-height:0}
  .quiz{display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,1fr); column-gap:28px; align-content:start}
  .quiz > .strip, .quiz > .linebar, .quiz > .qhead, .quiz > .hint{grid-column:1 / -1}
  .quiz > .qcard{grid-column:1; align-self:start; position:sticky; top:76px; max-height:calc(100vh - 190px); overflow:auto; margin-top:14px}
  .quiz > .side{grid-column:2; min-width:0}
  .quiz .opts{margin-top:14px}
}
@media (min-width:1200px){ .weeks{grid-template-columns:repeat(3, minmax(0,1fr))} }
</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script>
const DATA = [{"w":0,"title":"Week 0 : Assignment 0","practice":true,"qs":[{"q":"There are n bins of which the \\(k\\)-th bin contains \\(k − 1\\) blue balls and \\(n − k\\) red balls. You pick a bin at random and remove two balls at random without replacement. Find the probability that:<br><br><div>• the second ball is red;<\/div><div>• the second ball is red, given that the first is red.<\/div>","o":["1/3, 2/3","1/2, 1/3","1/2, 2/3","1/3, 1/3"],"a":[2],"m":false,"h":"By symmetry, a random bin is as likely to be \"k\" as \"n+1−k\", so red and blue swap roles. For the second part, use P(2nd red | 1st red) = P(both red) / P(1st red).","e":"Averaged over bins, red and blue are symmetric, so P(2nd red) = 1/2. P(both red) works out to 1/3, so P(2nd red | 1st red) = (1/3)/(1/2) = 2/3."},{"q":"A medical company touts its new test for a certain genetic disorder. The false negative rate is small: if you have the disorder, the probability that the test returns a positive result is 0.999. The false positive rate is also small: if you do not have the disorder, the probability that the test returns a positive result is only 0.005. Assume that 2% of the population has the disorder. If a person chosen uniformly from the population is tested and the result comes back positive, what is the probability that the person has the disorder?","o":["0.803","0.976","0.02","0.204"],"a":[0],"m":false,"h":"Bayes' rule: P(D | +) = P(+ | D)·P(D) / [P(+ | D)·P(D) + P(+ | no D)·P(no D)].","e":"\\(\\frac{0.999 \\times 0.02}{0.999 \\times 0.02 + 0.005 \\times 0.98} = \\frac{0.01998}{0.02488} \\approx 0.803\\). Even a good test gives many false alarms when the disease is rare."},{"q":"In an experiment, \\(n\\) coins are tossed, with each one showing up heads with probability \\(p\\) independently of the others. Each of the coins which shows up heads is then tossed again. What is the probability of observing 5 heads in the second round of tosses, if we toss 15 coins in the first round and \\(p = 0.4\\)? <br><br> (Hint: First find the mass function of the number of heads observed in the second round.)","o":["0.372","0.055","0.0345","0.0488"],"a":[1],"m":false,"h":"A coin shows heads in round 2 only if it shows heads twice in a row. What's that probability for one coin?","e":"Each coin independently gives a second-round head with probability \\(p^2 = 0.16\\), so the count is Binomial(15, 0.16). \\(\\binom{15}{5}(0.16)^5(0.84)^{10} \\approx 0.055\\)."},{"q":"Consider two random variables \\(X\\) and \\(Y\\) having joint density function \\(\\displaystyle f (x, y) = 2e^{−x−y} , 0 &lt; x &lt; y &lt; ∞ \\). Are \\(X\\) and \\(Y\\) independent? Find the covariance of \\(X\\) and \\(Y\\) .","o":["Yes, 1/4","Yes, 1/2","No, 1/4","No, 1/2"],"a":[2],"m":false,"h":"Look at the support: is the region 0 &lt; x &lt; y a rectangle? For the covariance, note X ~ Exp(2) and Y = X + an independent Exp(1).","e":"The support is a triangle (x &lt; y), so X and Y can't be independent. Writing Y = X + E with E independent gives Cov(X, Y) = Var(X) = 1/(2²) = 1/4."},{"q":"An airline knows that 5 percent of the people making reservations on a certain flight will not show up. Consequently, their policy is to sell 52 tickets for a flight that can hold only 50 passengers. What is the probability that there will be a seat available for every passenger who shows up?","o":["0.5101","0.81","0.6308","0.7405"],"a":[3],"m":false,"h":"Shows ~ Binomial(52, 0.95). Everyone gets a seat unless 51 or 52 people show up.","e":"\\(1 - 0.95^{52} - 52(0.05)(0.95)^{51} \\approx 1 - 0.069 - 0.190 = 0.7405\\)."},{"q":"Let X have mass function <br><br>\\(\\displaystyle f(x) =\\begin{cases} \\{x(x+1) \\}^{-1} &amp; if \\,\\, x = 1,2,..., \\\\ 0 &amp; otherwise, \\end{cases}\\) <br><br> and let \\(\\displaystyle α ∈ \\mathbb{R}\\). For what values of \\(\\displaystyle α\\) is it the case that \\(\\displaystyle \\mathbb{E}(X^α ) &lt; ∞ \\) ?","o":["\\(\\displaystyle α &lt; \\frac{1}{2}\\)","\\(\\displaystyle α &lt; 1\\)","\\(\\displaystyle α &gt; 1\\)","\\(\\displaystyle α &lt; \\frac{3}{4}\\)"],"a":[1],"m":false,"h":"\\(\\mathbb{E}(X^\\alpha) = \\sum x^\\alpha / (x(x+1))\\). For large x the terms behave like \\(x^{\\alpha-2}\\). When does \\(\\sum x^{\\alpha-2}\\) converge?","e":"\\(\\sum x^{\\alpha-2}\\) converges iff α − 2 &lt; −1, i.e. α &lt; 1."},{"q":"Is the following a distribution function? <br><br>\\(\\displaystyle F(x) =\\begin{cases} e^{-1/x} &amp; x &gt; 0 \\\\ 0 &amp; otherwise, \\end{cases}\\) <br><br> If so, give the corresponding density function. If not, mention why it is not a distribution function.","o":["No, not a monotonic function\\(\\)","Yes, \\(\\displaystyle x^{−2} e^{−1/x} , x &gt; 0\\)","No, not right continuous\\(\\)","Yes, \\(x^{−1} e^{−1/x} , x &gt; 0\\)"],"a":[1],"m":false,"h":"Check the three CDF properties: non-decreasing, right-continuous, limits 0 and 1. If it passes, differentiate.","e":"\\(e^{-1/x}\\) rises from 0 (as x→0⁺) to 1 (as x→∞) and is continuous, so it's a valid CDF. Density: \\(\\frac{d}{dx}e^{-1/x} = x^{-2}e^{-1/x}\\) for x &gt; 0."},{"q":"Can the value of a probability density function be greater than one? What about the cumu- lative distribution function?","o":["PDF: yes, CDF: yes","PDF: yes, CDF: no","PDF: no, CDF: yes","PDF: no, CDF: no"],"a":[1],"m":false,"h":"A density only has to integrate to 1. Think of Uniform(0, 0.5). A CDF is a probability.","e":"A PDF can exceed 1 (Uniform(0, 0.5) has density 2). A CDF is a probability, so it always stays in [0, 1]."},{"q":"You are given a biased coin with probability of seeing a head is \\(p = 0.6\\) and probability of seeing a tail is \\(q = 0.4\\). Suppose you toss the coin 10 times, what is the probability of you getting the head at most 2 times? Also, what is the probability of you getting the head for the first time on your fourth attempt?","o":["0.012, 0.038","0.054, 0.038","0.012, 0.064","0.054, 0.064"],"a":[0],"m":false,"h":"P(at most 2 heads) = P(0) + P(1) + P(2) from Binomial(10, 0.6). First head on the 4th toss = three tails, then a head.","e":"\\(0.4^{10} + 10(0.6)(0.4)^9 + 45(0.6)^2(0.4)^8 \\approx 0.012\\). Geometric: \\(0.4^3 \\times 0.6 = 0.0384 \\approx 0.038\\)."},{"q":"Given a bag containing 6 red balls, 4 blue balls and 7 green balls, what is the probability that in 5 trials, at least 3 red balls are drawn from the bag?","o":["0.24","0.38","0.17","0.43"],"a":[0],"m":false,"h":"P(red) = 6/17 on each draw (with replacement). Then use Binomial(5, 6/17) for X ≥ 3.","e":"Adding P(3) + P(4) + P(5) for Binomial(5, 0.353) gives ≈ 0.24."},{"q":"In the experiment from the previous question, what is the probability of picking a red ball for the first time on the fourth attempt?","o":["0.271","0.320","0.096","0.103"],"a":[2],"m":false,"h":"Geometric distribution: three non-red draws, then a red.","e":"\\((11/17)^3 \\times (6/17) \\approx 0.271 \\times 0.353 \\approx 0.096\\)."}]},{"w":1,"title":"Week 1 : Non Graded Assignment","practice":true,"qs":[{"q":"Which of the following tasks can be best solved using clustering.","o":["Predicting the amount of rainfall based on various cues","Detecting fraudulent credit card transactions","Training a robot to solve a maze"],"a":[1],"m":false,"h":"Which task has no labels and is about grouping \"normal\" behaviour so that the odd ones stand out?","e":"Fraud detection is often done as clustering/anomaly detection: normal transactions form clusters and fraud sits far from them. Rainfall is regression, and the maze is reinforcement learning."},{"q":"Pavlov’s experiment is a classic experiment conducted by the Russian physiologist Ivan Pavlov. He experiments on dogs shown in the image below.<br><br><img alt=\"\" src=\"https://storage.googleapis.com/swayam-node1-production.appspot.com/assets/img/noc20_cs73/P1A1Q2.png\"><br>(Image source - <a href=\"http://www.goldiesroom.org/\">http://www.goldiesroom.org/<\/a>)<br><br>Before conditioning dog responds with saliva only in presence of the food but after conditioning it starts salivating just with the bell. Select the correct option(s) about the experiment.<div><br><div>• Presence of just the bell<\/div><div>• Presence of just food<\/div><div>• Presence of both food and bell<\/div><\/div>","o":["In this experiment, the dog acts as a Reinforcement learning agent","In this experiment, the dog learns in a supervised setting","Comparing this experiment to Reinforcement learning theory, the various states are"],"a":[0,2],"m":true,"h":"The dog is never told the \"right answer\". It learns from rewards (food) linked to situations.","e":"This is reinforcement learning: the dog is the agent, the reward is food, and the states are the combinations of bell/food. Nobody gives it labelled examples, so it isn't supervised."},{"q":"<div>There are <i>n<\/i> bins of which the <i>k<\/i>th contains <i>k − 1<\/i> blue balls and <i>n − k<\/i> red balls. You pick a bin at random and remove two balls at random without replacement. Find the probability that:<\/div><div><br><\/div><div>• the second ball is red;<\/div><div>• the second ball is red, given that the first is red.<\/div>","o":["1/3, 2/3","1/2, 1/3","1/2, 2/3","1/3, 1/3"],"a":[2],"m":false,"h":"By symmetry, a random bin is as likely to be \"k\" as \"n+1−k\", so red and blue swap roles. For the second part, use P(both red) / P(1st red).","e":"P(2nd red) = 1/2 by symmetry. P(both red) = 1/3, so the conditional is (1/3)/(1/2) = 2/3."},{"q":"A medical company touts its new test for a certain genetic disorder. The false negative rate is small: if you have the disorder, the probability that the test returns a positive result is 0.999. The false positive rate is also small: if you do not have the disorder, the probability that the test returns a positive result is only 0.005. Assume that 2% of the population has the disorder. If a person chosen uniformly from the population is tested and the result comes back positive, what is the probability that the person has the disorder?","o":["0.803","0.976","0.02","0.204"],"a":[0],"m":false,"h":"Bayes' rule: P(D | +) = P(+ | D)·P(D) / P(+).","e":"\\(\\frac{0.999 \\times 0.02}{0.999 \\times 0.02 + 0.005 \\times 0.98} \\approx 0.803\\)."},{"q":"In an experiment, <i>n<\/i> coins are tossed, with each one showing up heads with probability <i>p<\/i> independently of the others. Each of the coins which shows up heads is then tossed again. What is the probability of observing 5 heads in the second round of tosses, if we toss 15 coins in the first round and <i>p<\/i> = 0.4? <br>(Hint: First find the mass function of the number of heads observed in the second round.)","o":["0.372","0.055","0.0345","0.0488"],"a":[1],"m":false,"h":"A coin gives a second-round head only if it lands heads twice.","e":"The count is Binomial(15, p² = 0.16): \\(\\binom{15}{5}(0.16)^5(0.84)^{10} \\approx 0.055\\)."}]},{"w":1,"title":"Week 1 : Assignment 1","practice":false,"qs":[{"q":"Which of the following is a supervised learning problem?","o":["Grouping related documents from an unannotated corpus.","Predicting credit approval based on historical data","Predicting rainfall based on historical data","Predicting if a customer is going to return or keep a particular product he/she purchased from e-commerce website based on the historical data about the customer purchases and the particular product.","Fingerprint recognition of a particular person used in biometric attendance from the fingerprint data of various other people and that particular person"],"a":[1,2,3,4],"m":true,"h":"Supervised = learning from historical examples that already have the answer (label). Which options have labelled past data?","e":"Credit approval, rainfall, returns and fingerprint matching all learn from labelled history. Grouping an unannotated corpus has no labels, so it is unsupervised."},{"q":"Which of the following is not a classification problem?","o":["Predicting the temperature (in Celsius) of a room from other environmental features (such as atmospheric pressure, humidity etc).","Predicting if a cricket player is a batsman or bowler given his playing records.","Predicting the price of house (in INR) based on the data consisting prices of other house (in INR) and its features such as area, number of rooms, location etc.","Filtering of spam messages","Predicting the weather for tomorrow as “hot”, “cold”, or “rainy” based on the historical data wind speed, humidity, temperature, and precipitation."],"a":[0,2],"m":true,"h":"Classification predicts a category; regression predicts a number. Find the options whose output is a continuous quantity.","e":"Temperature in °C and house price in INR are continuous outputs, so those are regression. Batsman/bowler, spam and hot/cold/rainy are categories."},{"q":"Which of the following is a regression task? (multiple options may be correct)","o":["Predicting the monthly sales of a cloth store in rupees.","Predicting if a user would like to listen to a newly released song or not based on historical data.","Predicting the confirmation probability (in fraction) of your train ticket whose current status is waiting list based on historical data.","Predicting if a patient has diabetes or not based on historical medical records.","Predicting if a customer is satisfied or unsatisfied from the product purchased from e-commerce website using the the reviews he/she wrote for the purchased product."],"a":[0,2],"m":true,"h":"Regression = the output is a real number (sales amount, a probability value…).","e":"Monthly sales in rupees and a confirmation probability (a fraction) are real-valued. The others are yes/no or category predictions."},{"q":"Which of the following is an unsupervised task?","o":["Predicting if a new edible item is sweet or spicy based on the information of the ingredients, their quantities, and labels (sweet or spicy) for many other similar dishes.","Grouping related documents from an unannotated corpus.","Grouping of hand-written digits from their image.","Predicting the time (in days) a PhD student will take to complete his/her thesis to earn a degree based on the historical data such as qualifications, department, institute, research area, and time taken by other scholars to earn the degree.","all of the above"],"a":[1,2],"m":true,"h":"Unsupervised = no labels are given; the algorithm finds structure by itself.","e":"Grouping unannotated documents and grouping handwritten digit images (without labels) are clustering tasks. The sweet/spicy and PhD-time options use labelled history."},{"q":"Which of the following is a categorical feature?","o":["Number of rooms in a hostel.","Minimum RAM requirement (in GB) of a system to play a game like FIFA, DOTA.","Your weekly expenditure in rupees.","Ethnicity of a person","Area (in sq. centimeter) of your laptop screen.","The color of the curtains in your room."],"a":[3,5],"m":true,"h":"Categorical features take values from a set of names with no numeric meaning.","e":"Ethnicity and curtain colour are categories. Room count, RAM, money and area are numeric."},{"q":"Let \\(X\\) and \\(Y\\) be a uniformly distributed random variable over the interval [0, 4] and [0, 6] respectively. If \\(X\\) and \\(Y\\) are independent events, then compute the probability, \\(\\mathbb{P}(\\max(X, Y ) &gt; 3)\\)","o":["\\(\\displaystyle \\frac{1}{6}\\)","\\(\\displaystyle \\frac{5}{6}\\)","\\(\\displaystyle \\frac{2}{3}\\)","\\(\\displaystyle \\frac{1}{2}\\)","\\(\\displaystyle \\frac{2}{6}\\)","\\(\\displaystyle \\frac{5}{8}\\)","None of the above"],"a":[5],"m":false,"h":"P(max &gt; 3) = 1 − P(X ≤ 3 and Y ≤ 3). Use independence.","e":"\\(1 - \\frac{3}{4}\\cdot\\frac{3}{6} = 1 - \\frac{3}{8} = \\frac{5}{8}\\)."},{"q":"Let the trace and determinant of a matrix \\(\\displaystyle A \\begin{bmatrix} a &amp; b \\\\ c &amp; d \\end{bmatrix}\\) be 6 and 16 respectively. The eigenvalues of A are","o":["\\(\\displaystyle \\frac{3+ \\imath\\sqrt{7}}{2} , \\frac{3- \\imath\\sqrt{7}}{2},\\) where \\(\\displaystyle \\imath = \\sqrt{-1}\\)","\\(1,3\\)","\\(\\displaystyle \\frac{3+ \\imath\\sqrt{7}}{4} , \\frac{3- \\imath\\sqrt{7}}{4},\\) where \\(\\displaystyle \\imath = \\sqrt{-1}\\)","\\(1/2,3/2\\)","\\(\\displaystyle 3+ \\imath \\sqrt{7}, 3 - \\imath \\sqrt{7},\\) where \\(\\displaystyle \\imath = \\sqrt{-1}\\)","\\(2,8\\)","None of the above","Can be computed only if A is a symmetric matrix.","Can not be computed as the entries of the matrix A are not given."],"a":[4],"m":false,"h":"Eigenvalues solve λ² − (trace)λ + det = 0.","e":"λ² − 6λ + 16 = 0 gives \\(λ = \\frac{6 \\pm \\sqrt{36-64}}{2} = 3 \\pm \\imath\\sqrt{7}\\)."},{"q":"What happens when your model complexity increases? (multiple options may be correct)","o":["Model Bias decreases","Model Bias increases","Variance of the model decreases","Variance of the model increases"],"a":[0,3],"m":true,"h":"A more flexible model fits training data more closely. What happens to systematic error, and what happens to sensitivity to the particular sample?","e":"Bias decreases (the model can capture more patterns) and variance increases (the fit changes a lot between datasets)."},{"q":"A new phone, E-Corp X1 has been announced and it is what you’ve been waiting for, all along. You decide to read the reviews before buying it. From past experiences, you’ve figured out that good reviews mean that the product is good 90% of the time and bad reviews mean that it is bad 70% of the time. Upon glancing through the reviews section, you find out that the X1 has been reviewed 1269 times and only 172 of them were bad reviews. What is the probability that, if you order the X1, it is a bad phone?","o":["0.136","0.160","0.360","0.840","0.773","0.573","0.181"],"a":[6],"m":false,"h":"Total probability: P(bad) = P(bad | bad review)·P(bad review) + P(bad | good review)·P(good review).","e":"P(bad review) = 172/1269, and a good review still leaves 10% bad: 0.7(172/1269) + 0.1(1097/1269) ≈ 0.095 + 0.086 = 0.181."},{"q":"Which of the following are false about bias and variance of overfitted and underfitted models? (multiple options may be correct)","o":["Underfitted models have high bias.","Underfitted models have low bias.","Overfitted models have low variance.","Overfitted models have high variance."],"a":[1,2],"m":true,"h":"Recall: underfit = high bias, low variance; overfit = low bias, high variance. Pick the statements that contradict this.","e":"\"Underfitted models have low bias\" and \"Overfitted models have low variance\" are the false ones."}]},{"w":2,"title":"Week 2 : Non Graded Assignment","practice":true,"qs":[{"q":"Let <i>A<sup>m×n<\/sup><\/i> be a matrix of real numbers. The matrix <i>AA<sup>T<\/sup><\/i> has an eigenvector <i>x<\/i> with eigenvalue <i>b<\/i>. Then the eigenvector <i>y<\/i> of <i>A<sup>T<\/sup><\/i> A which has eigenvalue <i>b<\/i> is equal to","o":["Ax","A<sup>T<\/sup>x","bx","Cannot be described in terms of x"],"a":[1],"m":false,"h":"Start from \\(AA^Tx = bx\\) and multiply both sides on the left by \\(A^T\\).","e":"\\(A^TA(A^Tx) = b(A^Tx)\\), so \\(y = A^Tx\\) is an eigenvector of \\(A^TA\\) with the same eigenvalue b."},{"q":"Let <i>A<sup>n×n<\/sup><\/i> be a row stochaistic matrix - in other words, all elements are non-negative and the sum of elements in every row is 1. Let b be an eigenvalue of <i>A<\/i>. <br>Which of the following is true?","o":["|b| &gt; 1","|b| ≤ 1","|b| ≥ 1","|b| &lt; 1"],"a":[1],"m":false,"h":"Multiplying a row-stochastic matrix by a vector gives weighted averages of its entries. Can an average be bigger than the largest entry?","e":"If Av = bv, take the entry of v with the largest |v_i|: |b||v_i| ≤ Σ_j a_ij|v_j| ≤ |v_i|, so |b| ≤ 1. (Also, 1 is always an eigenvalue, with the all-ones vector.)"},{"q":"Let u be a <i>n × 1<\/i> vector, such that <i>u<sup>T<\/sup> u<\/i> = 1. Let I be the <i>n × n<\/i> identity matrix. The <i>n × n<\/i> matrix A is given by<span> (I − kuu<sup>T<\/sup> ),<\/span> where <i>k<\/i> is a real constant. <br><i>u<\/i> itself is an eigenvector of <i>A<\/i>, with eigenvalue −1. What is the value of <span>k<\/span>?","o":["-2","-1","2","0"],"a":[2],"m":false,"h":"Compute Au directly, using \\(u^Tu = 1\\).","e":"\\(Au = u - k\\,u(u^Tu) = (1-k)u\\). For eigenvalue −1 we need 1 − k = −1, so k = 2."},{"q":"Which of the following are true for any <i>m × n<\/i> matrix <i>A<\/i> of real numbers.","o":["The rowspace of <i>A<\/i> is the same as the columnspace of <i>A<sup>T<\/sup><\/i>","The rowspace of <i>A<\/i> is the same as the rowspace of <i>A<sup>T<\/sup><\/i>","The eigenvectors of <i>AA<sup>T<\/sup><\/i> are the same as the eigenvectors of <i>A<sup>T<\/sup> A<\/i>","The <b>non-zero <\/b>eigenvalues of <i>AA<sup>T<\/sup><\/i> are the same as the <b>non-zero<\/b> eigenvalues of <i>A<sup>T<\/sup> A<\/i>"],"a":[0,3],"m":true,"h":"The rows of A are the columns of \\(A^T\\). And \\(AA^T\\) and \\(A^TA\\) have different sizes (m×m vs n×n).","e":"The row space of A = the column space of \\(A^T\\) (same vectors). \\(AA^T\\) and \\(A^TA\\) share their non-zero eigenvalues (singular values squared), but their eigenvectors live in different spaces."},{"q":"Consider the following 4 training examples<br><br><div>• <span>x<\/span> = −1, <span>y<\/span> = 0.0319<\/div><div>• <span>x<\/span> = 0, <span>y<\/span> = 0.8692<\/div><div>• <span>x<\/span> = 1, <span>y<\/span> = 1.9566<\/div><div>• <span>x<\/span> = 2, <span>y<\/span> = 3.0343<br><br><div>We want to learn a function <span>f (x) = ax + b<\/span> which is parametrized by <span>(a, b)<\/span>. Using squared error as the loss function, which of the following parameters would <br>you use to model this function.<\/div><\/div>","o":["(1, 1)","(1, 2)","(2, 1)","(2, 2)"],"a":[0],"m":false,"h":"Look at the points: as x goes up by 1, how much does y go up? What is y at x = 0?","e":"y rises by about 1 per unit of x and is ≈ 0.9–1 at x = 0, so f(x) ≈ x + 1, i.e. (a, b) = (1, 1)."}]},{"w":2,"title":"Week 2 : Assignment 2","practice":false,"qs":[{"q":"Given a training data set of 10,000 instances, with each input instance having 17 dimensions and each output instance having 2 dimensions, the dimensions of the design matrix used in applying linear regression to this data is","o":["10000 × 17","10002 × 17","10000 × 18","10000 × 19"],"a":[2],"m":false,"h":"Rows = instances. Columns = input features plus one column of 1s for the intercept. Output dimensions don't change the design matrix.","e":"10000 × (17 + 1) = 10000 × 18."},{"q":"Suppose we want to add a regularizer to the linear regression loss function, to control the magnitudes of the weights \\(β\\). We have a choice between \\(\\displaystyle \\Omega_1(\\beta) = \\Sigma_{i=1}^p |\\beta|\\) and \\(\\Omega_2(\\beta) = \\Sigma_{i=1}^p \\beta^2\\) Which one is more likely to result in sparse weights?","o":["\\(Ω_1\\)","\\(Ω_2\\)","Both \\(Ω_1\\) and \\(Ω_2\\) will result in sparse weights","Neither of \\(Ω_1\\) or \\(Ω_2\\) can result in sparse weights"],"a":[0],"m":false,"h":"Picture the constraint regions: an L1 \"diamond\" has corners on the axes; an L2 ball is round.","e":"The L1 penalty (lasso, Ω₁) tends to hit the corners, setting some weights exactly to 0, so it gives sparse weights. The L2 penalty (ridge) only shrinks them."},{"q":"The model obtained by applying linear regression on the identified subset of features may differ from the model obtained at the end of the process of identifying the subset during","o":["Forward stepwise selection","Backward stepwise selection","Forward stagewise selection","All of the above"],"a":[2],"m":false,"h":"In which method are coefficients built up in small increments instead of being refit by full least squares?","e":"In forward stagewise selection, coefficients move in small steps and are never fully refit, so they can differ from an OLS fit on the final chosen subset."},{"q":"Consider forward selection, backward selection and best subset selection with respect to the same data set. Which of the following is true?","o":["Best subset selection can be computationally more expensive than forward selection","Forward selection and backward selection always lead to the same result","Best subset selection can be computationally less expensive than backward selection","Best subset selection and forward selection are computationally equally expensive","Both (b) and (d)"],"a":[0],"m":false,"h":"How many models does each method try? Best subset tries all \\(2^p\\) subsets.","e":"Best subset is exhaustive (\\(2^p\\) models), while forward selection is greedy (about p²/2 models), so best subset can be much more expensive. Forward and backward can end at different subsets."},{"q":"In the lecture on Multivariate Regression, you learn about using orthogonalization iteratively to obtain regression co-effecients. This method is generally referred to as Multiple Regression using Successive Orthogonalization. In the formulation of the method, we observe that in iteration \\(k\\), we regress the entire dataset on \\(z_0 , z_1 , . . . z_{k−1}\\) . It seems like a waste of computation to recompute the coefficients for \\(z_0\\) a total of \\(p\\) times, \\(z_1\\) a total of \\(p − 1\\) times and so on. Can we re-use the coefficients computed in iteration \\(j\\) for iteration \\(j + 1\\) for \\(z_{j−1}\\) ?","o":["No. Doing so will result in the wrong \\(γ\\) matrix. and hence, the wrong \\(β_i\\) ’s.","Yes. Since \\(z_{j−1}\\) is orthogonal to \\(z_{j−l} ∀ l ≤ j1\\), the multiple regression in each iteration is essentially a univariate regression on each of the previous residuals. Since the regression coefficients for the previous residuals don’t change over iterations, we can re-use the coefficients for further iterations."],"a":[1],"m":false,"h":"The \\(z_j\\) are mutually orthogonal. What does regressing on orthogonal inputs reduce to?","e":"With orthogonal regressors, multiple regression splits into separate univariate regressions, so earlier coefficients never change and can be reused."},{"q":"Principal Component Regression (PCR) is an approach to find an orthogonal set of basis vectors which can then be used to reduce the dimension of the input. Which of the following matrices contains the principal component directions as its columns (follow notation from the lecture video)","o":["\\(X\\)","\\(S\\)","\\(X_c\\)","\\(V\\)","\\(U\\)"],"a":[3],"m":false,"h":"Think of the SVD \\(X = UDV^T\\). Which matrix holds directions in feature space?","e":"The columns of V are the principal component directions. XV = UD gives the projected data (the components)."},{"q":"Consider the following five training examples<br><br><img alt=\"\" src=\"https://storage.googleapis.com/swayam-node1-production.appspot.com/assets/img/noc21_cs24/W2A2Q7.png\"><br><br><br>We want to learn a function \\(f (x)\\) of the form \\(f (x) = ax + b\\) which is parameterised by \\((a, b)\\). Using squared error as the loss function, which of the following parameters would you use to model this function to get a solution with the minimum loss.","o":["(4,3)","(1,4)","(4,1)","(3,4)"],"a":[3],"m":false,"h":"Fit y = ax + b by least squares: \\(a = \\frac{\\sum(x-\\bar x)(y-\\bar y)}{\\sum(x-\\bar x)^2}\\), \\(b = \\bar y - a\\bar x\\), or check which option fits the table best.","e":"Least squares on the table gives a = 3, b = 4."},{"q":"Here is a data set of words in two languages.<br><br><img alt=\"\" src=\"https://storage.googleapis.com/swayam-node1-production.appspot.com/assets/img/noc21_cs24/W2A2Q8.png\"><br><div>Let us build a nearest neighbours classifier that will predict which language a word belongs to. Say we represent each word using the following features.<\/div><div>• Length of the word<\/div><div>• Number of consonants in the word<\/div><div>• Whether it ends with the letter ’o’ (1 if it does, 0 if it doesn’t)<br><br><div>For example, the representation of the word ‘waffle’ would be [6, 2, 0]. For a distance function, use the Manhattan distance.<br><br><\/div><\/div> \\(\\displaystyle d(a, b) = \\Sigma_{i=1}^n|a_i − b_i |\\) where \\(\\displaystyle a, b ∈ R^n\\)<br><br>Take the input word ‘keto’. With k = 1, the predicted language for the word is?<br>","o":["English","Vinglish","None of the above"],"a":[0],"m":false,"h":"Encode 'keto' as [length, consonants, ends-in-o] = [4, 2, 1], then find the training word with the smallest Manhattan distance.","e":"The nearest neighbour of [4, 2, 1] (k = 1) is an English word in the table, so the prediction is English."}]},{"w":3,"title":"Week 3 : Non Graded Assignment","practice":true,"qs":[{"q":"The model obtained by applying linear regression on the identified subset of features may differ from the model obtained at the end of the process of identifying the subset during","o":["Best-subset selection","Forward stepwise selection","Forward stagewise selection","All of the above"],"a":[2],"m":false,"h":"Which method updates coefficients in small steps instead of refitting by least squares?","e":"Forward stagewise: its coefficients aren't fully refit, so they can differ from a least-squares fit on the chosen features."},{"q":"Given the following 3D input data, identify the principal component.<br><br><div>1 1 9<\/div><div>2 4 6<\/div><div>3 7 4<\/div><div>4 11 4<\/div><div>5 9 2<br><br><\/div><div>(Steps: center the data, calculate the sample covariance matrix, calculate the eigen vectors and eigen values, identify the principal component)<\/div>","o":["<div>0.9138<\/div><div>-0.1035<\/div><div>0.3926<\/div>","<div>-0.2617<\/div><div>0.5891<\/div><div>0.7645<\/div>","<div>-0.4205<\/div><div>-0.6223<\/div><div>0.2342<\/div>","<div>-0.3105<\/div><div>-0.8014<\/div><div>0.5112<\/div>"],"a":[3],"m":false,"h":"The principal component is a unit vector pointing along the direction of greatest spread. Which feature varies most? Check that the option's vector has length 1.","e":"Feature 2 (1→11) has by far the largest spread, so the PC should weight it most. Option D is unit-length and dominated by feature 2. Option C isn't even unit-length."},{"q":"For the data given in the previous question, find the transformed input along the first two principal components.","o":["<div>6.9935 0.3021<\/div><div>2.7451 -0.2727<\/div><div>-0.9921 -0.4548<\/div><div>-4.5081 0.0449<\/div><div>-4.2383 0.3805<\/div>","<div>6.9935 0.4003<\/div><div>2.7451 -0.3876<\/div><div>-0.9921 -0.4110<\/div><div>-4.5081 1.6837<\/div><div>-4.2383 -1.2853<\/div>","<div>0.4003 0.3021<\/div><div>-0.3876 -0.2727<\/div><div>-0.4110 -0.4548<br><div>1.6837 0.0449<\/div><div>-1.2853 0.3805<\/div><\/div>","<div>3.4894 7.2079<\/div><div>-0.7590 6.4200<\/div><div>-4.4962 6.3966<\/div><div>-8.0122 8.4913<\/div><div>-7.7424 5.5223<\/div>"],"a":[1],"m":false,"h":"Project the centred data onto PC1 and PC2. The PC1 column should have the biggest spread; the PC2 column comes next.","e":"The first column (6.99, 2.75, −0.99, …) is the PC1 score. Option B's second column has larger spread than option A's, which is actually the third component. So B is right."},{"q":"Suppose you are only allowed to use binary logistic classifiers to solve a multi-class classification problem. Given a training set with 2 classes, this classifier can learn a model, which can then be used to classify a new test point to one of the 2 classes in the training set. You are now given a 6 class problem along with its training set, and have to use more than one binary logistic classifier to solve the problem, as mentioned before. You propose the following scheme (also known as one vs one approach in ML terminology) - you will first train a binary logistic classifier for every pair of classes. Now, for a new test point, you will run it through each of these models, and the class which wins the maximum number of pairwise contests, is the predicted label for the test point. How many binary logistic classifiers will you need to solve the problem using your proposed scheme?","o":["25","15","18","12"],"a":[1],"m":false,"h":"One-vs-one trains one classifier for every pair of classes. How many pairs are there in 6 classes?","e":"\\(\\binom{6}{2} = 15\\)."},{"q":"With respect to Linear Discriminant Analysis, which of the following is/are true. (Consider a two class case)","o":["When both the covariance matrices are spherical and equal, the decision boundary will be the perpendicular bisector of the line joining the means.","When both the covariance matrices are spherical and equal, the decision boundary will be perpendicular to the line joining the means.","When both the covariance matrices are spherical and equal and the priors π<sub>1<\/sub> = π<sub>2<\/sub> then the decision boundary will be perpendicular bisector of the line joining the means."],"a":[1,2],"m":true,"h":"With equal spherical covariances, the LDA boundary is perpendicular to the line joining the means. Where along that line does it cross? That depends on the priors.","e":"It is always perpendicular to the line joining the means. It is the perpendicular bisector only when the priors are equal too."}]},{"w":3,"title":"Week 3 : Assignment 3","practice":false,"qs":[{"q":"Which of the following is false about a logistic regression based classifier?","o":["The logistic function is non-linear in the weights","The logistic function is linear in the weights","The decision boundary is non-linear in the weights","The decision boundary is linear in the weights"],"a":[1,2],"m":true,"h":"The question asks for the FALSE statements. The logistic function \\(1/(1+e^{-\\beta^Tx})\\) is non-linear in β, but p = 0.5 happens when \\(\\beta^Tx = 0\\).","e":"The false statements: \"the logistic function is linear in the weights\" and \"the decision boundary is non-linear\". The boundary \\(\\beta^Tx = 0\\) is linear."},{"q":"Consider the case where two classes follow Gaussian distribution which are cen- tered at (3, 9) and (−3, 3) and have identity covariance matrix. Which of the following is the separating decision boundary using LDA assuming the priors to be equal?","o":["\\(y − x = 3\\)","\\(x + y = 3\\)","\\(x + y = 6\\)","both (b) and (c)","None of the above","Can not be found from the given information"],"a":[2],"m":false,"h":"Equal identity covariances and equal priors give the perpendicular bisector of the two means.","e":"Midpoint = (0, 6); the means differ by (6, 6), so the boundary is perpendicular to (1, 1) through (0, 6): x + y = 6."},{"q":"Consider the following relation between a dependent variable and an independent variable identified by doing simple linear regression. Which among the following relations between the two variables does the graph indicate?<br><br><img alt=\"\" src=\"https://storage.googleapis.com/swayam-node1-production.appspot.com/assets/img/noc21_cs24/W3A3Q3.png\">","o":["as the independent variable increases, so does the dependent variable","as the independent variable increases, the dependent variable decreases","if an increase in the value of the dependent variable is observed, then the independent variable will show a corresponding increase","if an increase in the value of the dependent variable is observed, then the independent variable will show a corresponding decrease","the dependent variable in this graph does not actually depend on the independent variable","none of the above"],"a":[4],"m":false,"h":"Look at the slope of the fitted line. What does a flat line mean?","e":"The fitted line is flat (slope ≈ 0), so changing the independent variable doesn't change the dependent one: there is no dependence."},{"q":"Given the following distribution of data points:<br><br><img alt=\"\" src=\"https://storage.googleapis.com/swayam-node1-production.appspot.com/assets/img/noc21_cs24/W3A3Q4.png\"><br><br>What method would you choose to perform Dimensionality Reduction?<br>","o":["Linear Discriminant Analysis","Principal Component Analysis"],"a":[0],"m":false,"h":"PCA keeps the direction of largest variance and ignores class labels; LDA keeps the direction that best separates classes.","e":"Here the largest-variance direction mixes the two classes, so PCA would destroy the separation. LDA uses the labels and keeps the classes apart."},{"q":"In general, which of the following classification methods is the most resistant to gross outliers?","o":["Quadratic Discriminant Analysis (QDA)","Linear Regression","Logistic regression","Linear Discriminant Analysis (LDA)"],"a":[2],"m":false,"h":"Which method's fit is driven mostly by points near the decision boundary rather than far-away points?","e":"Logistic regression is the most robust: the log-loss flattens out for far-away correctly classified points. LDA/QDA estimate means and covariances, which outliers drag, and linear regression's squared loss blows up on outliers."},{"q":"Suppose that we have two variables, X and Y (the dependent variable). We wish to find the relation between them. An expert tells us that <br>relation between the two has the form \\(Y = m + X^2 + c\\). Available to us are samples of the variables X and Y. Is it possible to apply linear regression to this data to estimate the values of \\(m\\) and \\(c\\)?","o":["no","yes","insufficient information"],"a":[0],"m":false,"h":"Y = m + X² + c. Can m and c ever be told apart from the data?","e":"Only the sum m + c affects Y, so m and c can't be estimated separately (they aren't identifiable)."},{"q":"In a binary classification scenario where \\(x\\) is the independent variable and \\(y\\) is the dependent variable, logistic regression assumes that the conditional distribution \\(y|x\\) follows a","o":["Bernoulli distribution","binomial distribution","normal distribution","exponential distribution"],"a":[0],"m":false,"h":"y takes values 0/1 for a single observation. Which distribution models one yes/no trial?","e":"Logistic regression models y | x as Bernoulli with p = σ(βᵀx)."},{"q":"Consider the following data:<br><br><img alt=\"\" src=\"https://storage.googleapis.com/swayam-node1-production.appspot.com/assets/img/noc21_cs24/W3A3Q8.png\"><br><br>Assuming that you apply LDA to this data, what is the estimated covariance matrix?<br>","o":["\\(\\displaystyle \\begin{bmatrix} 1.875 &amp; 0.3125 \\\\ 0.3125 &amp; 0.9375 \\end{bmatrix}\\)","\\(\\displaystyle \\begin{bmatrix} 2.5 &amp; 0.4167 \\\\ 0.4167 &amp; 1.25 \\end{bmatrix}\\)","\\(\\displaystyle \\begin{bmatrix} 1.875 &amp; 0.3125 \\\\ 0.3125 &amp; 1.2188 \\end{bmatrix}\\)","\\(\\displaystyle \\begin{bmatrix} 2.5 &amp; 0.4167 \\\\ 0.4167 &amp; 1.625 \\end{bmatrix}\\)","\\(\\displaystyle \\begin{bmatrix} 3.25 &amp; 1.1667 \\\\ 1.1667 &amp; 2.375 \\end{bmatrix}\\)","\\(\\displaystyle \\begin{bmatrix} 2.4375 &amp; 0.875 \\\\ 0.875 &amp; 1.7812 \\end{bmatrix}\\)","None of these"],"a":[6],"m":false,"h":"LDA uses the pooled within-class covariance: compute each class's scatter around its own mean, add them, and divide by N − K.","e":"Doing that on this data gives a matrix that doesn't match any of the options, so the answer is \"None of these\"."},{"q":"Given the following 3D input data, identify the principal component.<br><br><img alt=\"\" src=\"https://storage.googleapis.com/swayam-node1-production.appspot.com/assets/img/noc21_cs24/W3A3Q9.png\"><br><br>(Steps: center the data, calculate the sample covariance matrix, calculate the eigenvectors and eigenvalues, identify the principal component)","o":["\\(\\displaystyle \\begin{bmatrix} -0.1022 \\\\ 0.0018 \\\\ 0.9948 \\end{bmatrix} \\)","\\(\\displaystyle \\begin{bmatrix} 0.5742 \\\\ -0.8164 \\\\ 0.0605 \\end{bmatrix}\\)","\\(\\displaystyle \\begin{bmatrix} 0.5742 \\\\ 0.8164 \\\\ 0.0605 \\end{bmatrix}\\)","\\(\\displaystyle \\begin{bmatrix} -0.5742 \\\\ 0.8164 \\\\ 0.0605 \\end{bmatrix}\\)","\\(\\displaystyle \\begin{bmatrix} 0.8123 \\\\ 0.5774 \\\\ 0.0824 \\end{bmatrix}\\)","None of the above"],"a":[4],"m":false,"h":"Centre the data, form the covariance matrix, and take the eigenvector with the largest eigenvalue. The sign doesn't matter, but the length must be 1.","e":"The top eigenvector of the sample covariance is ≈ (0.8123, 0.5774, 0.0824)."},{"q":"For the data given in the previous question, find the transformed input along the first two principal components.","o":["\\(\\displaystyle \\begin{bmatrix} 0.6100 &amp; -0.0196 \\\\ -0.4487 &amp; -0.1181 \\\\ -1.2651 &amp; -0.1163 \\\\ 1.3345 &amp; 0.5702 \\\\ 0.5474 &amp; -0.7257 \\\\ -1.0250 &amp; 0.2727 \\\\ -1.2672 &amp; 0.1724 \\\\ 1.5142 &amp; -0.0355 \\end{bmatrix}\\)","\\(\\displaystyle \\begin{bmatrix} -0.1817 &amp; 0.8944 \\\\ -1.2404 &amp; 0.7959 \\\\ -2.0568 &amp; 0.7977 \\\\ 0.5428 &amp; 1.4842 \\\\ -0.2443 &amp; 0.1884 \\\\ -1.8167 &amp; 1.1868 \\\\ -2.0589 &amp; 1.0864 \\\\ 0.7225 &amp; 0.8785 \\end{bmatrix}\\)","\\(\\displaystyle \\begin{bmatrix} -6.2814 &amp; 0.6100 \\\\ -4.3143 &amp; -0.4487 \\\\ -3.7368 &amp; -1.2651 \\\\ -1.7950 &amp; 1.3345 \\\\ 2.2917 &amp; 0.5474 \\\\ 3.5289 &amp; -1.0250 \\\\ 4.9186 &amp; -1.2672 \\\\ 5.3883 &amp; 1.5142 \\end{bmatrix}\\)","\\(\\displaystyle \\begin{bmatrix} 1.4721 &amp; -0.1817 \\\\ 3.4392 &amp; -1.2404 \\\\ 4.0166 &amp; -2.0568 \\\\ 5.9584 &amp; 0.5428 \\\\ 10.0451 &amp; -0.2443 \\\\ 11.2823 &amp; -1.8167 \\\\ 12.6720 &amp; -2.0589 \\\\ 13.1418 &amp; 0.7225 \\end{bmatrix}\\)","None of the above"],"a":[2],"m":false,"h":"The scores on each PC should average to zero, and the PC1 column should have the largest spread.","e":"Option C's first column (−6.28 … 5.39) sums to ≈ 0 and has large spread (PC1 scores); the second column is the PC2 scores. Option D isn't centred."}]},{"w":4,"title":"Week 4 : Non Graded Assignment","practice":true,"qs":[{"q":"Which of the following are convex functions?","o":["\\(\\displaystyle f (x) = ( \\Sigma_{i=1}^n x_i^p)^{1/p}\\) where \\(x ∈ R^n\\) and \\(p ≥ 0\\)","\\( \\displaystyle f (x) = log( \\Sigma_{i=1}^n \\, exp \\, x_i)\\) where \\(x_i ∈ R^n\\)","\\(\\displaystyle f (x) = \\Sigma_{i=1}^n \\sin (x_i),\\) where \\(x ∈ R^n\\)","\\(\\displaystyle f (x) = \\Sigma_{i=1}^n x_i \\log \\, x_i\\) where \\(x ∈ R^n\\)"],"a":[1,3],"m":true,"h":"Known convex functions: log-sum-exp and x log x. sin oscillates. Is \\((\\sum x_i^p)^{1/p}\\) convex for 0 &lt; p &lt; 1?","e":"log(Σ exp xᵢ) and Σ xᵢ log xᵢ are convex. The p-\"norm\" isn't convex for p &lt; 1, and Σ sin(xᵢ) isn't convex."},{"q":"We discussed two approaches to classification, one that learns the discriminant functions, and the other that is based on modeling hyperplanes. Which of these approaches is more suitable for multi-class problems and why?","o":["Discriminant functions; because they allow for a probabilistic interpretation of the predictions.","Hyperplane methods; because they allow for a probabilistic interpretation of the predictions.","Discriminant functions; because an appropriate set of functions will allow us to efficiently disambiguate class predictions.","Hyperplane methods; because we can use basis expansion to transform the input to a space where class-boundaries are linear."],"a":[2],"m":false,"h":"With hyperplanes, one-vs-rest can leave regions claimed by no class or by several. How do discriminant functions avoid that?","e":"With one discriminant function per class, you pick the class with the largest score, so every point gets exactly one class and there are no ambiguous regions."},{"q":"Consider the following optimization problem <br><br>\\(\\min\\) \\(x^2 + 1\\) <br>\\(s.t. (x − 2)(x − 4) ≤ 0 \\)<br><br>Select the correct options regarding this optimization problem.<br>","o":["Strong Duality holds","Strong duality doesn’t hold.","The Lagrangian can be written as \\(\\displaystyle L(x, λ) = (1 + λ)x^2 − 6λx + 1 + 8λ\\)","The dual objective will be \\(\\displaystyle g(λ) = \\frac{-9λ^2}{1+λ}+ 1 + 8λ\\)"],"a":[0,2,3],"m":true,"h":"Feasible set: 2 ≤ x ≤ 4. It's a convex problem with a strictly feasible point (x = 3), so Slater's condition applies. Then write L = f + λ·g and minimise over x.","e":"Strong duality holds (Slater). L = (1 + λ)x² − 6λx + 1 + 8λ. Minimising over x at x = 3λ/(1 + λ) gives \\(g(λ) = -\\frac{9λ^2}{1+λ} + 1 + 8λ\\)."},{"q":"Which of the following is/are true about the Perceptron classifier?","o":["It can learn a OR function","It can learn a XOR function","The obtained separating hyperplane depends on the order in which the points are presented in the training process.","For a linearly separable problem, there exists some initialization of the weights which might lead to non-convergent cases."],"a":[0,2],"m":true,"h":"A single perceptron draws one straight line. Which of OR and XOR can be split by one line? Does the result depend on the order of the training points?","e":"OR is linearly separable and XOR isn't. The final hyperplane depends on the presentation order. For separable data the perceptron always converges, whatever the initialisation, so the last option is false."},{"q":"Which of the following is/are true regarding an SVM?","o":["For two dimensional data points, the separating hyperplane learnt by a linear SVM will be a straight line.","In theory, a Gaussian kernel SVM can model any complex separating hyperplane.","For every kernel function used in a SVM, one can obtain a equivalent closed form basis expansion.","Overfitting in an SVM is a function of number of support vectors."],"a":[0,1,3],"m":true,"h":"In 2D, what does a linear \"hyperplane\" look like? Can every kernel be written as a finite basis expansion?","e":"A linear SVM in 2D gives a straight line. The Gaussian kernel is universal (it can model any boundary). The Gaussian kernel's feature space is infinite-dimensional, so no closed-form finite expansion exists. Many support vectors suggests overfitting."}]},{"w":4,"title":"Week 4 : Assignment 4","practice":false,"qs":[{"q":"Consider a Boolean function in three variables, that returns True if two or more variables out of three are True, and False otherwise. Can this function be implemented using the perceptron algorithm?","o":["no","yes"],"a":[1],"m":false,"h":"Majority-of-3 is True when x₁ + x₂ + x₃ ≥ 2. Is that a linear threshold?","e":"Yes. The weights (1, 1, 1) with threshold 1.5 separate it perfectly, so a perceptron can learn it."},{"q":"For a support vector machine model, let \\(x_i\\) be an input instance with label \\(y_i\\) . If \\(y_i ( \\hat{β}_0 +x^T_i \\hat{β}) &gt; 1\\), where \\(β_0\\) and \\(\\hat{β})\\) are the estimated parameters of the model, then","o":["\\(x_i\\) is not a support vector","\\(x_i\\) is a support vector","\\(x_i\\) is either an outlier or a support vector","Depending upon other data points, x i may or may not be a support vector."],"a":[0],"m":false,"h":"Support vectors lie on or inside the margin, where \\(y_i f(x_i) \\le 1\\). What does &gt; 1 mean?","e":"\\(y_i f(x_i) &gt; 1\\) means the point is strictly outside the margin and correctly classified, so it isn't a support vector."},{"q":"Suppose we use a linear kernel SVM to build a classifier for a 2-class problem where the training data points are linearly separable. In general, will the classifier trained in this manner be always the same as the classifier trained using the perceptron training algorithm on the same training data?","o":["Yes","No"],"a":[1],"m":false,"h":"The perceptron stops at any separating line; the SVM looks for one specific line.","e":"The SVM finds the maximum-margin hyperplane, while the perceptron returns whichever separator it reaches first (order-dependent). They usually differ."},{"q":"Train a linear regression model (without regularization) on the above dataset. Report the coefficients of the best fit model. Report the coefficients in the following format: \\(β_0 , β_1 , β_2 , β_3\\) . (You can round-off the accuracy value to the nearest 2-decimal point number.)","o":["-1.2, 2.1, 2.2, 1","1, 1.2, 2.1, 2.2","-1, 1.2, 2.1, 2.2","1, -1.2, 2.1, 2.2","1, 1.2, -2.1, -2.2"],"a":[3],"m":false,"h":"Fit an unregularised LinearRegression on the dataset (e.g. in sklearn) and read off the intercept first, then the coefficients.","e":"The fitted model gives β = (1, −1.2, 2.1, 2.2)."},{"q":"Train an l2 regularized linear regression model on the above dataset. Vary the regularization parameter from 1 to 10. As you increase the regularization parameter, absolute value of the coefficients (excluding the intercept) of the model:","o":["increase","first increase then decrease","decrease","first decrease then increase"],"a":[2],"m":false,"h":"The L2 penalty adds λ‖β‖². What does a stronger penalty do to the coefficient sizes?","e":"Increasing λ shrinks the coefficients towards zero, so their absolute values decrease."},{"q":"Train an \\(l2\\) regularized logistic regression classifier on the modified iris dataset. We recommend using sklearn. Use only the first two features for your model. We encourage you to explore the impact of varying different hyperparameters of the model. Kindly note that the \\(C\\) parameter mentioned below is the inverse of the regularization parameter \\(λ\\). As part of the assignment train a model with the following hyperparameters: <br>Model: logistic regression with one-vs-rest classifier, \\(C = 1e4\\) <br>For the above set of hyperparameters, report the best classification accuracy","o":["0.88","0.86","0.98","0.68"],"a":[1],"m":false,"h":"Train LogisticRegression(C=1e4, one-vs-rest) on the first two features and score it on the test set. A large C means weak regularisation.","e":"The reported best accuracy is 0.86."},{"q":"Train an SVM classifier on the modified iris dataset. We recommend using sklearn. Use only the first two features for your model. We encourage you to explore the impact of varying different hyperparameters of the model. Specifically try different kernels and the associated hyperparameters. As part of the assignment train models with the following set of hyperparameters <br><br>RBF-kernel, \\(gamma = 0.5\\), one-vs-rest classifier, no-feature-normalization. Try \\(C = 0.01, 1, 10\\). For the above set of hyperparameters, report the best classification accuracy along with total number of support vectors on the test data.","o":["0.92, 69","0.88, 40","0.88, 69","0.98, 41"],"a":[2],"m":false,"h":"Train SVC(kernel='rbf', gamma=0.5) for C ∈ {0.01, 1, 10}, keep the best test accuracy, and count model.n_support_.","e":"The best accuracy is 0.88, with 69 support vectors."}]},{"w":5,"title":"Week 5 : Non Graded Assignment","practice":true,"qs":[{"q":"Given N samples \\(x_1 , x_2 , . . . , x_N\\) drawn independently from a Gaussian distribution with variance \\(σ_2\\) and unknown mean \\(μ\\), find the MLE of the mean.","o":["\\(\\displaystyle μ_{M LE} = \\frac{\\Sigma_{i=1}^N x_i}{σ^2}\\)","\\(\\displaystyle μ_{M LE} = \\frac{\\Sigma_{i=1}^N x_i}{2σ^2N}\\)","\\(\\displaystyle μ_{M LE} = \\frac{\\Sigma_{i=1}^N x_i}{N}\\)","\\(\\displaystyle μ_{M LE} = \\frac{\\Sigma_{i=1}^N x_i}{N-1}\\)"],"a":[2],"m":false,"h":"Write the log-likelihood \\(-\\sum (x_i-\\mu)^2 / 2σ^2\\) and set its derivative with respect to μ to 0.","e":"\\(\\sum(x_i - μ) = 0\\), so \\(μ_{MLE} = \\frac{1}{N}\\sum x_i\\), the sample mean."},{"q":"Continuing with the above question, assume that the prior distribution of the mean is also a Gaussian distribution, but with parameters mean \\(μ_p\\) and variance \\(σ_p^2\\) . Find the MAP estimate of the mean.","o":["\\(\\displaystyle μ_{M AP} = \\frac{σ^2 μ_p +σ_p^2 \\Sigma_{i=1}^N x_i}{σ^2 +N σ_p^2}\\)","\\(\\displaystyle μ_{M AP} = \\frac{σ^2 +σ_p^2 \\Sigma_{i=1}^N x_i}{σ^2+ σ_p^2}\\)","\\(\\displaystyle μ_{M AP} = \\frac{σ^2 +σ_p^2 \\Sigma_{i=1}^N x_i}{σ^2 +N σ_p^2}\\)","\\(\\displaystyle μ_{M AP} = \\frac{σ^2 μ_p +σ_p^2 \\Sigma_{i=1}^N x_i}{N(σ^2 + σ_p^2)}\\)"],"a":[0],"m":false,"h":"The MAP estimate is a precision-weighted mix of the prior mean and the data. Check the limits: N → ∞ should give the sample mean, and N = 0 should give μ_p.","e":"\\(μ_{MAP} = \\frac{σ^2 μ_p + σ_p^2\\sum x_i}{σ^2 + Nσ_p^2}\\). It tends to the sample mean for large N and to μ_p when there's no data."},{"q":"Which among the following statements is (are) true?","o":["MAP estimates suffer more from overfitting than maximum likelihood estimates.","MAP estimates are equivalent to the ML estimates when the prior used in the MAP is a uniform prior over the parameter space.","One drawback of maximum likelihood estimation is that in some scenarios (hint: multi- nomial distribution), it may return probability estimates of zero.","The parameters which minimize the expected Bayesian L1 Loss is the median of the posterior distribution."],"a":[1,2,3],"m":true,"h":"A prior acts like a regulariser. With a flat prior, the posterior is proportional to the likelihood. Which loss is minimised by the posterior median?","e":"True: a uniform prior makes MAP = ML; ML can give zero probabilities for unseen categories; the posterior median minimises expected L1 loss. False: MAP overfits less than ML, not more."},{"q":"Which of the following statements is/are true about Neural Networks?","o":["Neural Networks can model arbitrarily complex decision boundaries.","Neural Networks can be used to emulate a Gaussian kernel SVM.","Training of a neural network is very sensitive to the initial weights.","Ideal initialization for weights would be setting all of them to zeros"],"a":[0,1,2],"m":true,"h":"What happens if every weight starts at the same value (e.g. 0)?","e":"A neural net can model arbitrarily complex boundaries, can emulate an RBF/Gaussian-kernel SVM, and is sensitive to initialisation. All-zero initialisation is bad: every hidden unit gets the same gradient, so the symmetry never breaks."},{"q":"Which of the following is/are true about the Perceptron classifier?","o":["It can learn a OR function","It can learn a AND function","The obtained separating hyperplane depends on the order in which the points are presented in the training process.","For a linearly separable problem, there exists some initialization of the weights which might lead to non-convergent cases."],"a":[0,1,2],"m":true,"h":"OR and AND are both linearly separable; XOR isn't. Is convergence guaranteed on separable data?","e":"The perceptron learns OR and AND, and its final hyperplane depends on point order. On separable data it always converges, so the last option is false."}]},{"w":5,"title":"Week 5 : Assignment 5","practice":false,"qs":[{"q":"You are given the N samples of input (x) and output (y) as shown in the figure below. What will be the most appropriate model \\(y = f (x)\\)?<br><br><img alt=\"\" src=\"https://storage.googleapis.com/swayam-node1-production.appspot.com/assets/img/noc21_cs24/W5A5Q1.png\">","o":["\\(y = w \\dot{x} \\,\\, \\text{with} \\,\\, w &gt; 0\\)","\\(y = w\\dot{x} \\,\\, \\text{with} \\,\\, w &lt; 0\\)","\\(y = x^{w} \\,\\, \\text{with} \\,\\, w &gt; 0\\)","\\(y = x^{w} \\,\\, \\text{with} \\,\\, w &lt; 0\\)"],"a":[2],"m":false,"h":"Look at the curve's shape: it passes through the origin, increases, and bends. Which family has that shape?","e":"A power curve \\(y = x^w\\) with w &gt; 0 fits. Linear models give straight lines."},{"q":"For training a binary classification model with five independent variables, you choose to use neural networks. You apply one hidden layer with three neurons. What are the number of parameters to be estimated? (Consider the bias term as a parameter)","o":["16","21","3<sup>4<\/sup> = 81","4<sup>3<\/sup> = 64","12","22","25","26","4","None of these"],"a":[5],"m":false,"h":"Count weights layer by layer, including a bias for each neuron: (inputs + 1) × hidden, then (hidden + 1) × outputs.","e":"(5 + 1) × 3 = 18 and (3 + 1) × 1 = 4, so 22 parameters."},{"q":"Suppose the marks obtained by randomly sampled students follow a normal distribution with unknown μ. A random sample of 5 marks are 25, 55, 64, 7 and 99. Using the given samples find the maximum likelihood estimate for the mean.","o":["54.2","67.75","50","Information not sufficient for estimation"],"a":[2],"m":false,"h":"For a normal distribution, the MLE of the mean is the sample mean.","e":"(25 + 55 + 64 + 7 + 99) / 5 = 250 / 5 = 50."},{"q":"You are given the following neural networks which take two binary valued inputs \\(x_1 , x_2 ∈ \\{0, 1\\}\\) and the activation function is the threshold function\\((h(x) = 1\\) if \\(x &gt; 0; 0\\) otherwise). Which of the following logical functions does it compute?<br><br><img alt=\"\" src=\"https://storage.googleapis.com/swayam-node1-production.appspot.com/assets/img/noc21_cs24/W5A5Q4.png\">","o":["OR","AND","NAND","None of the above."],"a":[0],"m":false,"h":"Plug in all four inputs (0,0), (0,1), (1,0), (1,1) and apply the threshold.","e":"The output is 0 only for (0, 0) and 1 otherwise, which is OR."},{"q":"Using the notations used in class, evaluate the value of the neural network with a 3-3-1 archi- tecture (2-dimensional input with 1 node for the bias term in both the layers). The parameters are as follows<br><br> \\(\\displaystyle \\alpha = \\begin{bmatrix}1 &amp; 0.2 &amp; 0.4 \\\\ -1 &amp; 0.8 &amp; 0.5 \\end{bmatrix}\\)<br><br> \\(\\displaystyle \\beta = \\begin{bmatrix}0.8 &amp; 0.4 &amp; 0.5 \\end{bmatrix}\\)<br><br><br>Using sigmoid function as the activation functions at both the layers, the output of the network for an input of (0.8, 0.7) will be","o":["0.6710","0.9617","0.6948","0.7052","0.2023","0.7977","0.2446","None of these"],"a":[5],"m":false,"h":"Hidden unit j = σ(α_j0 + α_j1·x₁ + α_j2·x₂), output = σ(β₀ + β₁h₁ + β₂h₂), with x = (0.8, 0.7).","e":"h₁ = σ(1 + 0.16 + 0.28) = σ(1.44) ≈ 0.809, h₂ = σ(−1 + 0.64 + 0.35) = σ(−0.01) ≈ 0.498. Output = σ(0.8 + 0.4·0.809 + 0.5·0.498) = σ(1.372) ≈ 0.7977."},{"q":"Which of the following statements are true:","o":["The chances of overfitting decreases with increasing the number of hidden nodes and increasing the number of hidden layers.","A neural network with one hidden layer can represent any Boolean function given sufficient number of hidden units and appropriate activation functions.","Two hidden layer neural networks can represent any continuous functions (within a tolerance) as long as the number of hidden units is sufficient and appropriate activation functions used."],"a":[1,2],"m":true,"h":"Does adding nodes and layers make overfitting more or less likely? Recall the universal approximation results.","e":"More hidden units/layers increases overfitting risk, so the first statement is false. One hidden layer can represent any Boolean function, and two hidden layers can approximate any continuous function."},{"q":"We have a function which takes a two-dimensional input \\(x = (x_1 , x_2 )\\) and has two parameters \\(w = (w_1 , w_2 )\\) given by \\(f (x, w) = σ(σ(x_1 w_1 )w_2 + x_2 )\\) where \\(σ(x) = \\frac{1}{1+e^{-x}}\\) We use backprop- agation to estimate the right parameter values. We start by setting both the parameters to 1. Assume that we are given a training point \\(x_2 = 1, x_1 = 0, y = 5\\). Given this information answer the next two questions. What is the value of \\(\\displaystyle \\frac{∂f}{∂w_2}\\)?","o":["0.150","-0.25","0.125","0.098","0.0746","0.1604","None of these"],"a":[4],"m":false,"h":"Chain rule: f = σ(u) with u = σ(x₁w₁)·w₂ + x₂, so ∂f/∂w₂ = σ'(u)·σ(x₁w₁). Use σ'(u) = σ(u)(1 − σ(u)).","e":"x₁ = 0 gives σ(0) = 0.5, and u = 0.5 + 1 = 1.5, so σ(1.5) = 0.8176. ∂f/∂w₂ = 0.8176 × 0.1824 × 0.5 ≈ 0.0746."},{"q":"If the learning rate is 0.5, what will be the value of \\(w_2\\) after one update using backpropagation algorithm?","o":["0.4197","-0.4197","0.6881","-0.6881","1.3119","-1.3119","0.5625","-0.5625","None of these"],"a":[4],"m":false,"h":"Use loss (y − f)², so ∂L/∂w₂ = −2(y − f)·∂f/∂w₂, then update w₂ ← w₂ − η·∂L/∂w₂.","e":"∂L/∂w₂ = −2(5 − 0.8176)(0.0746) ≈ −0.624. w₂ = 1 − 0.5(−0.624) ≈ 1.312."},{"q":"Which of the following are true when comparing ANNs and SVMs?","o":["ANN error surface has multiple local minima while SVM error surface has only one minima","After training, an ANN might land on a different minimum each time, when initialized with random weights during each run.","As shown for Perceptron, there are some classes of functions that cannot be learnt by an ANN. An SVM can learn a hyperplane for any kind of
