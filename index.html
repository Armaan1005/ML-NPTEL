distribution.","In training, ANN’s error surface is navigated using a gradient descent technique while SVM’s error surface is navigated using convex optimization solvers."],"a":[0,1,3],"m":true,"h":"The SVM objective is convex; a neural network's loss isn't. Is either model truly unable to learn some class of functions?","e":"True: an ANN has many local minima while the SVM has one optimum; random initialisation leads to different minima; ANNs use gradient descent while SVMs use convex solvers. The third statement is false: multilayer ANNs aren't limited the way a single perceptron is."},{"q":"Which of the following are correct?","o":["A perceptron will learn the underlying linearly separable boundary with finite number of training steps.","XOR function can be modelled by a single perceptron.","Backpropagation algorithm used while estimating parameters of neural networks actually uses gradient descent algorithm.","The backpropagation algorithm will always converge to global optimum, which is one of the reasons for impressive performance of neural networks."],"a":[0,2],"m":true,"h":"Perceptron convergence theorem. Is XOR linearly separable? Does backprop guarantee a global optimum?","e":"The perceptron converges in finitely many steps on separable data, and backprop is gradient descent. XOR needs a hidden layer, and backprop can get stuck in local minima."}]},{"w":6,"title":"Week 6 : Non Graded Assignment","practice":true,"qs":[{"q":"Given that we can select the same feature multiple times during the recursive partitioning of the input space, is it always possible to achieve 100% accuracy on the training data (given that we allow for trees to grow to their maximum size) when building decision trees?","o":["Yes","No"],"a":[1],"m":false,"h":"What if two training points have identical features but different labels?","e":"Identical inputs with different labels (noise) can never be separated by any split, so 100% training accuracy isn't always possible."},{"q":"Which of the following statements are true with respect to the application of Cost-Complexity Pruning and Reduced Error Pruning with Cross-Validation?","o":["In Reduced Error Pruning, the pruned tree error can never be less than the original tree on the training dataset.","In Cost Complexity Pruning, the pruned tree error can never be less than the original tree on the validation dataset.","In Reduced Error Pruning, the pruned tree error can never be less than the original tree on the validation dataset.","both (b) and (c)"],"a":[0],"m":false,"h":"Pruning a fully grown tree removes splits that fit the training data. Can that ever lower training error?","e":"A full tree already fits the training data best, so after reduced-error pruning the training error can only stay the same or go up. Pruning can improve validation error, so those statements are false."},{"q":"Suppose on performing reduced error pruning, we collapsed a node and observed an improvement in the prediction accuracy on the validation set. Which among the following statements are possible in light of the performance improvement observed? (multiple options may be correct)","o":["The collapsed node helped overcome the effect of one or more noise affected data points in the training set","The validation set had one or more noise affected data points in the region corresponding to the collapsed node","The validation set did not have any data points along at least one of the collapsed branches","The validation set did have data points adversely affected by the collapsed node"],"a":[0,1,2,3],"m":true,"h":"The node was collapsed because validation accuracy went up. List every way that can happen.","e":"All four are possible: the node may have been fitting training noise, the validation set may have noise in that region, a branch may have had no validation points, or the collapse may have hurt some validation points while helping more."},{"q":"Consider the following data set:<br><br><img alt=\"\" src=\"https://storage.googleapis.com/swayam-node1-production.appspot.com/assets/img/noc21_cs24/P6A6Q1.png\"><br><br>Considering ’profitable’ as the binary valued attribute we are trying to predict, which of the attributes would you select as the root in a decision tree with multi-way splits using the information gain measure?","o":["Price","maintenance","capacity","airbag"],"a":[2],"m":false,"h":"Compute information gain = parent entropy − weighted child entropy for each attribute, and pick the largest.","e":"From the table, \"capacity\" gives the purest split (highest information gain), so it becomes the root."},{"q":"For the same data set, suppose we decide to construct a decision tree using binary splits and the Gini index impurity measure. Which among the following feature and split point combinations would be the best to use as the root node assuming that we consider each of the input features to be unordered?","o":["price - {low, med}|{high}","maintenance - {high}|{med, low}","maintenance - {high, med}|{low}","capacity - {2}|{4, 5}"],"a":[2],"m":false,"h":"For each binary grouping, compute the weighted Gini impurity of the two children and pick the lowest.","e":"Splitting maintenance into {high, med} | {low} gives the lowest weighted Gini impurity."}]},{"w":6,"title":"Week 6 : Assignment 6","practice":false,"qs":[{"q":"When building models using decision trees we essentially split the entire input space using","o":["axis parallel hyper-rectangles","polynomials curves of order greater than two","polynomial curves of the same order as the length of decision tree","none of the above"],"a":[0],"m":false,"h":"Each tree node tests one feature against a threshold. What shape of region does that make?","e":"Every split is on a single feature, so the regions are axis-parallel hyper-rectangles."},{"q":"In building a decision tree model, to control the size of the tree, we need to control the number of regions. One approach to do this would be to split tree nodes only if the resultant decrease in the sum of squares error exceeds some threshold. For the described method, which among the following are true?","o":["it would, in general, help restrict the size of the trees","it has the potential to affect the performance of the resultant regression/classification model","it is computationally infeasible"],"a":[0,1],"m":true,"h":"This is early stopping with a threshold. Is it cheap to compute? What is its known drawback?","e":"It restricts tree size and can affect performance (a useless-looking split may lead to a great split later). It's cheap to compute, so \"computationally infeasible\" is false."},{"q":"Suppose we use the decision tree model for solving a multi-class classification problem. As we continue building the tree, w.r.t. the generalisation error of the model,","o":["the error due to bias increases","the error due to bias decreases","the error due to variance increases","the error due to variance decreases"],"a":[1,2],"m":true,"h":"A deeper tree fits training data more closely. Same bias–variance logic as model complexity.","e":"As the tree grows, bias decreases and variance increases."},{"q":"Having built a decision tree, we are using reduced error pruning to reduce the size of the tree. We select a node to collapse. For this particular node, on the left branch, there are 3 training data points with the following outputs: 5, 7, 9.6 and for the right branch, there are four training data points with the following outputs: 8.7, 9.8, 10.5, 11. The average value of the outputs of data points denotes the response of a branch. The original responses for data points 1along the two branches (left right respectively) were <i>response _left<\/i> and,<i> response_right<\/i> and the new response after collapsing the node is <i>response_new<\/i>. What are the values for <i>response_left<\/i>, <i>response_right<\/i> and <i>response_new<\/i> (numbers in the option are given in the same order)?","o":["21.6, 40, 61.6","7.2; 10; 8.8","3, 4, 7","depends on the tree height."],"a":[1],"m":false,"h":"The response of a branch is the mean of its outputs; after collapsing, take the mean of all 7 points.","e":"Left = (5 + 7 + 9.6)/3 = 7.2, right = (8.7 + 9.8 + 10.5 + 11)/4 = 10, combined = 61.6/7 = 8.8."},{"q":"Consider the following dataset:<br><img alt=\"\" src=\"https://storage.googleapis.com/swayam-node1-production.appspot.com/assets/img/noc21_cs24/5.png\"><br><div>Which among the following split-points for the<i> feature<sub>1<\/sub><\/i> would give the best split according to the information gain measure?<\/div>","o":["14.6","16.05","16.85","17.35"],"a":[1],"m":false,"h":"Sort by feature 1, take midpoints where the class changes, and compute the information gain at each candidate.","e":"The split at 16.05 gives the highest information gain."},{"q":"For the same dataset, which among the following split-points for <i>feature2 <\/i>would give the best split according to the gini index measure?","o":["172.6","176.35","178.45","185.4"],"a":[0],"m":false,"h":"Same process with the Gini index on feature 2: compute the weighted child impurity at each candidate split point.","e":"The split at 172.6 gives the lowest weighted Gini impurity."},{"q":"In which of the following situations is it appropriate to introduce a new category ’Missing’ for missing values? (multiple options may be correct)","o":["When values are missing because the 108 emergency operator is sometimes attending a very urgent distress call.","When values are missing because the attendant spilled coffee on the papers from which the data was extracted.","When values are missing because the warehouse storing the paper records went up in flames and burnt parts of it.","When values are missing because the nurse/doctor finds the patient’s situation too urgent."],"a":[0,3],"m":true,"h":"A \"Missing\" category helps when the fact that a value is missing says something about the outcome.","e":"When it's missing because the case was urgent (the 108 operator, an urgent patient), missingness carries information, so give it its own category. Spilled coffee or a fire is random, so impute instead."}]},{"w":7,"title":"Week 7 : Non Graded Assignment","practice":true,"qs":[{"q":"For the ROC curve of True positive rate vs False positive rate, which of the following are true?","o":["The curve is always concave (negative convex).","The curve is never concave.","The curve may or may not be concave"],"a":[2],"m":false,"h":"Consider a poor classifier whose ROC dips below the diagonal in places.","e":"An ROC curve may or may not be concave. A good classifier's curve often is, but nothing guarantees it."},{"q":"For the given confusion matrix, compute the recall<br><br><img alt=\"\" src=\"https://storage.googleapis.com/swayam-node1-production.appspot.com/assets/img/noc20_cs29/W7A7Q3.png\">","o":["0.73","0.7","0.8","0.78","None of the above"],"a":[2],"m":false,"h":"Recall = TP / (TP + FN): out of the actual positives, how many did we catch?","e":"From the confusion matrix, TP / (TP + FN) = 0.8."},{"q":"Do you think that the bagging procedure can be useful to improve the performance of linear regression?","o":["Yes","No","Insufficient information to answer the question"],"a":[1],"m":false,"h":"Bagging helps by averaging away variance. Is linear regression a high-variance, unstable learner?","e":"No. Linear regression is stable (low variance), so the bagged models are nearly identical and averaging them changes little."},{"q":"In which approach do the classification models train on data sets whose distribution are modified in comparison to the distribution of the original training data set","o":["bagging","boosting","both","neither"],"a":[2],"m":false,"h":"Bagging draws bootstrap samples; boosting re-weights points. Does each change the training distribution?","e":"Both do. Bootstrap resampling changes the empirical distribution, and boosting re-weights examples."},{"q":"Considering the AdaBoost algorithm, which among the following statements are false?","o":["In each stage, we try to train a classifier which makes accurate predictions on any subset of the data points where the subset size is at least half the size of the data set","In each stage, we try to train a classifier which makes accurate predictions on a subset of the data points where the subset contains more of the data points which were miscalssified in earlier stages","The weight assigned to an individual classifier depends upon the number of data points correctly classified by the classifier","The weight assigned to an individual classifier depends upon the weighted sum error of misclassified points for that classifier"],"a":[0,2],"m":true,"h":"Find the FALSE statements. AdaBoost focuses on previously misclassified points, and a classifier's weight α depends on its weighted error.","e":"False: \"accurate on any subset of at least half the data\" and \"weight depends on the number of points correctly classified\". The weight is \\(α = \\frac{1}{2}\\ln\\frac{1-ε}{ε}\\), based on weighted error."}]},{"w":7,"title":"Week 7 : Assignment 7","practice":false,"qs":[{"q":"For the given confusion matrix, compute the recall<br><br><img alt=\"\" src=\"https://storage.googleapis.com/swayam-node1-production.appspot.com/assets/img/noc21_cs24/W7A7Q1.png\">","o":["0.73","0.7","0.6","0.67","0.78","None of the above"],"a":[3],"m":false,"h":"Recall = TP / (TP + FN), computed from the confusion matrix.","e":"Reading off the matrix: TP / (TP + FN) ≈ 0.67."},{"q":"You have 2 <b>multi-class<\/b> classifiers A and B. A has accuracy = 0% and B has accuracy = 50%. Which classifier is more useful?","o":["A","B","Both are equally good","Depends on the number of classes"],"a":[3],"m":false,"h":"With 2 classes, a classifier that is always wrong can be flipped. What about with 10 classes?","e":"In a binary problem, 0% accuracy is perfect once you flip the outputs. With many classes, \"always wrong\" tells you little. So it depends on the number of classes."},{"q":"For large datasets, we should always be choosing large \\(k\\) while doing \\(k\\)− fold cross validation to get better performance on test set.","o":["True","False"],"a":[1],"m":false,"h":"Large k means many expensive training runs and highly correlated folds. Is bigger always better?","e":"False. Large k costs more compute and gives higher-variance estimates; k = 5 or 10 is usually enough."},{"q":"We have a dataset with 1000 samples and 5 classes for classification. What would be the training size for a 20 fold cross validation?","o":["50","200","800","950"],"a":[3],"m":false,"h":"20 folds of 1000 samples: each fold holds out one part for testing.","e":"Each fold has 50 samples, so training uses 1000 − 50 = 950."},{"q":"Which of the following are true?<br><br>TP - True Positive, TN - True Negative, FP - False Positive, FN - False Negative<br>","o":["\\(\\displaystyle \\text{Precision} = \\frac{TP}{T P +F P}\\)","\\(\\displaystyle \\text{Recall} = \\frac{TP}{T P +F N}\\)","\\(\\displaystyle \\text{Accuracy} = \\frac{2(T P +T N )}{T P +T N +F P +F N}\\)","\\(\\displaystyle \\text{Recall} = \\frac{FP}{T P +F P}\\)"],"a":[0,1],"m":true,"h":"Write out each formula. Is there a stray factor in any of them?","e":"Precision = TP/(TP + FP) and Recall = TP/(TP + FN). The accuracy formula has an extra factor of 2, and the last option isn't recall."},{"q":"In the ROC plot, what are the quantities along x and y axes respectively?","o":["Precision, Recall","Recall, Precision","True Positive Rate, False Positive Rate","False Positive Rate, True Positive Rate","Specificity, Sensitivity","True Positive, True Negative","True Negative, True Positive"],"a":[3],"m":false,"h":"An ROC curve plots the hit rate against the false-alarm rate as the threshold changes.","e":"The x-axis is the False Positive Rate and the y-axis is the True Positive Rate."},{"q":"How does bagging help in improving the classification performance?","o":["If the parameters of the resultant classifiers are fully uncorrelated (independent), then bagging is inefficient.","It helps reduce variance","If the parameters of the resultant classifiers are fully correlated, then bagging is inefficient.","It helps reduce bias"],"a":[1,2],"m":true,"h":"Averaging helps when models make different mistakes. What if all bagged models are identical (fully correlated)?","e":"Bagging reduces variance. If the models are fully correlated, averaging adds nothing. Bagging doesn't reduce bias, and uncorrelated models are its best case."},{"q":"Which method among bagging and stacking should be chosen in case of limited training data? and What is the appropriate reason for your preference?","o":["Bagging, because we can combine as many classifier as we want by training each on a different sample of the training data","Bagging, because we use the same classification algorithms on all samples of the training data","Stacking, because we can use different classification algorithms on the training data","Stacking, because each classifier is trained on all of the available data"],"a":[3],"m":false,"h":"Bootstrap samples contain only about 63% unique points. What data does each stacked base model see?","e":"Stacking, because each base classifier can be trained on all of the available data. That matters most when data is limited."},{"q":"Which of the following statements are false when comparing Committee Machines and Stacking","o":["Committee Machines are, in general, special cases of 2-layer stacking where the second- layer classifier provides uniform weightage.","Both Committee Machines and Stacking have similar mechanisms, but Stacking uses different classifiers while Committee Machines use similar classifiers.","Committee Machines are more powerful than Stacking","Committee Machines are less powerful than Stacking"],"a":[1,2],"m":true,"h":"Find the FALSE statements. A committee machine averages with equal weights; stacking learns the weights.","e":"False: \"Stacking uses different classifiers while committees use similar ones\" (both can mix) and \"committee machines are more powerful\". A committee is a special case of stacking with uniform weights, so it's less powerful."}]},{"w":8,"title":"Week 8 : Non Graded Assignment","practice":true,"qs":[{"q":"In AdaBoost, we re-weight points giving points misclassified in previous iterations more weight. Suppose we introduced a limit or <br> cap on the weight that any point can take (for example, say we introduce a restriction that prevents any point’s weight from <br> exceeding a value of 10). Which among the following would be an effect of such a modification? (Multiple options may be correct)","o":["We may observe the performance of the classifier reduce as the number of stages increase","It makes the final classifier robust to outliers","It may result in lower overall performance"],"a":[1,2],"m":true,"h":"Capping weights stops any one point from dominating. Which kind of points get huge weights?","e":"Outliers keep being misclassified and gain huge weights, so a cap makes the classifier more robust to outliers. It can also lower performance on genuinely hard points."},{"q":"A and B are Boolean random variables. <br> Given: \\(P (A = True) = 0.3, P (A = F alse) = 0.7, P (B = T rue|A = T rue) = 0.4, P (B = F alse|A = T rue) = 0.6,\\)<br> \\( P (B = T rue|A = F alse) = 0.6, P (B = F alse|A = F alse) = 0.4.\\) Calculate \\(P (A = T rue|B = F alse)\\) by Bayes rule.","o":["0.49","0.39","0.37","0.28","None of the above"],"a":[1],"m":false,"h":"P(A = T | B = F) = P(B = F | A = T)·P(A = T) / P(B = F).","e":"P(B = F) = 0.3·0.6 + 0.7·0.4 = 0.46. Answer = 0.18 / 0.46 ≈ 0.39."},{"q":"Which of the following method(s) is not inherently sequential?","o":["Gradient Boosting","Committee machines","AdaBoost"],"a":[1],"m":false,"h":"In which method does each member need the previous member's results?","e":"Committee machines train each member independently (in parallel). Gradient boosting and AdaBoost build models one after another."},{"q":"In a tournament classifier with N classes. What is the complexity of the number of classifiers we require?","o":["\\( \\mathcal{O} (N )\\)","\\( \\mathcal{O} (N^2)\\)","\\( \\mathcal{O} (N.log(N) )\\)","\\( \\mathcal{O} (log(N))\\)"],"a":[0],"m":false,"h":"A knockout tournament: each match eliminates one class. How many matches to get a winner?","e":"N − 1 classifiers are needed per prediction path, which is O(N)."},{"q":"Consider the following graphical model, which of the following are true about the model? (multiple options may be correct)<br><br><img alt=\"\" src=\"https://storage.googleapis.com/swayam-node1-production.appspot.com/assets/img/noc20_cs29/W8A8Q10.png\">","o":["d is independent of b when c is known","a is independent of c when e is known","a is independent of b when e is known","a is independent of b when c is known"],"a":[0,3],"m":true,"h":"Use d-separation: a chain or fork is blocked when the middle node is observed; a collider is blocked unless it (or a descendant) is observed.","e":"Tracing the paths in the graph: observing c blocks every path from d to b and from a to b, so those two independences hold. Conditioning on e leaves a path open, so the other two fail."}]},{"w":8,"title":"Week 8 : Assignment 8","practice":false,"qs":[{"q":"The Naive Bayes classifier makes the assumption that the ________are independent given the _________.","o":["features, class labels","class labels, features","features, data points","there is no such assumption"],"a":[0],"m":false,"h":"The \"naive\" assumption: given the label, the features don't influence each other.","e":"The features are assumed independent given the class label."},{"q":"Can the decision boundary produced by the Naive Bayes algorithm be non-linear?","o":["no","yes"],"a":[1],"m":false,"h":"Take Gaussian Naive Bayes with different variances per class. What does the log-ratio of class likelihoods look like?","e":"It has x² terms, so the boundary is quadratic: Naive Bayes boundaries can be non-linear."},{"q":"A major problem of using the one vs. rest multi-class classification approach is:","o":["class imbalance","increased time complexity"],"a":[0],"m":false,"h":"In one-vs-rest, compare the size of the \"one\" class with the size of the \"rest\".","e":"Each binary problem pits one class against all the others, causing class imbalance."},{"q":"Consider the problem of learning a function \\(X → Y\\) , where \\(Y\\) is Boolean. \\(X\\) is an input vector \\((X_1 , X_2 )\\), where \\(X_1\\) is categorical and takes 3 values, and \\(X_2\\) is a continuous variable (normally distributed). What would be the minimum number of parameters required to define a Naive Bayes model for this function?","o":["8","10","9","5"],"a":[2],"m":false,"h":"Count the parameters: the class prior; for X₁, 3 categories per class; for X₂, a mean and variance per class.","e":"Prior: 1. X₁: (3 − 1) × 2 = 4. X₂: 2 × 2 = 4. Total = 9."},{"q":"In boosting, the weights of data points that were miscalssified are __________ as training progresses.","o":["decreased","increased","first decreased and then increased","kept unchanged"],"a":[1],"m":false,"h":"Boosting makes later learners focus on hard points.","e":"Misclassified points' weights are increased."},{"q":"In a random forest model let \\( m &lt;&lt; p \\) be the number of randomly selected features that are used to identify the best split at any node of a tree. Which of the following are true? (\\(p\\) is the original number of features) <br>(Multiple options may be correct)","o":["increasing \\(m\\) reduces the correlation between any two trees in the forest","decreasing \\(m\\) reduces the correlation between any two trees in the forest","increasing \\(m\\) increases the performance of individual trees in the forest","decreasing \\(m\\) increases the performance of individual trees in the forest"],"a":[1,2],"m":true,"h":"With fewer candidate features per split, trees look more different from each other, but each one is weaker.","e":"Decreasing m reduces the correlation between trees; increasing m makes each individual tree stronger."},{"q":"Consider the following graphical model, which of the following are false about the model? (multiple options may be correct)<br><br><img alt=\"\" src=\"https://storage.googleapis.com/swayam-node1-production.appspot.com/assets/img/noc21_cs24/W8A8Q7.png\">","o":["A is independent of B when C is known","D is independent of A when C is known","D is not independent of A when B is known","D is not independent of A when C is known"],"a":[0,1],"m":true,"h":"Find the FALSE claims using d-separation on the graph. Watch for colliders, where observing a node connects its parents.","e":"Tracing the paths: with C observed, A–B and D–A still have an active path, so \"A ⊥ B | C\" and \"D ⊥ A | C\" are the false statements."},{"q":"Consider the Bayesian network given in the previous question. Let ‘A’, ‘B’, ‘C’, ‘D’and ‘E’denote the random variables shown in the network. Which of the following can be inferred from the network structure?","o":["‘A’causes ‘D’","‘E’causes ‘D’","‘C’causes ‘A’","options (a) and (b) are correct","none of the above can be inferred"],"a":[4],"m":false,"h":"Does an edge in a Bayesian network prove causation?","e":"No. A Bayesian network encodes conditional independences, not causal direction, so none of the causal claims can be inferred."}]},{"w":9,"title":"Week 9 : Non Graded Assignment","practice":true,"qs":[{"q":"Consider the bayesian network shown below.<br><br><img alt=\"\" src=\"https://storage.googleapis.com/swayam-node1-production.appspot.com/assets/img/noc20_cs29/W9A9Q1.png\"><br><br> Two students - Student A and Student B make the following claims:<div>• Student A claims \\(P (A| \\{ B, D \\}) = P (A|D)\\)<\/div><div>• Student B claims \\(P (A|B) = P (A)\\)<br><br> where \\(P (X|Y )\\) denotes probability of event \\(X\\) given \\(Y\\) . Please note that \\(Y\\) can be a set. Which of the following is true?<\/div>","o":["Student A and Student B are correct.","Student A is correct and Student B is incorrect.","Student A is incorrect and Student B is correct.","Both are incorrect.","Insufficient information to make any conclusion. Probability distributions of each variable should be given."],"a":[2],"m":false,"h":"Use d-separation: check whether every path between A and the other variable is blocked, given what is observed.","e":"Given D, a path from A to B stays active, so Student A's claim fails. With nothing observed, every path between A and B is blocked, so A ⊥ B and Student B is correct."},{"q":"Consider the Bayesian graph shown below in Figure 2.<br><br><img alt=\"\" src=\"https://storage.googleapis.com/swayam-node1-production.appspot.com/assets/img/noc20_cs29/W9A9Q3.png\"><br> The random variables are modeled as discrete variables and the corresponding CPDs are as below.<br><br><img alt=\"\" src=\"https://storage.googleapis.com/swayam-node1-production.appspot.com/assets/img/noc20_cs29/W9A9Q3b.png\"><br> What is the probability of \\(P (i = 1, d = 0, g = 2, s = 1, l = 0)\\)?","o":["0.004608","0.006144","0.003992","0.007309","None of these"],"a":[1],"m":false,"h":"The joint factorises along the graph: P(i)·P(d)·P(g | i, d)·P(s | i)·P(l | g). Read each value from the CPD tables.","e":"Multiplying the five table entries gives 0.006144."},{"q":"Consider the Markov network shown below in Figure 3<br><br><img alt=\"\" src=\"https://storage.googleapis.com/swayam-node1-production.appspot.com/assets/img/noc20_cs29/W9A9Q5.png\"><br><div> Two students - Student A and Student B make the following claims:<\/div><div>• Student A claims \\(P (A|B) = P (A)\\)<\/div><div>• Student B claims \\(P (A| \\{B, C \\}) = P (A|C)\\)<\/div><div> Which of the following is true?<\/div>","o":["Student A and Student B are correct.","Student A is incorrect and Student B is correct.","Student A is correct and Student B is incorrect.","Both are incorrect.","Insufficient information to make any conclusion. Probability distributions of each variable should be given."],"a":[1],"m":false,"h":"In a Markov network, A ⊥ B | C holds if removing C disconnects A from B.","e":"A and B are connected, so they aren't marginally independent. Removing C separates them, so P(A | B, C) = P(A | C). Student B is right."},{"q":"<div>In the Markov network given in Figure 4, two students make the following claims:<\/div><div><br><span> <img alt=\"\" src=\"https://storage.googleapis.com/swayam-node1-production.appspot.com/assets/img/noc21_cs24/W9A9Q6.png\"><br>• Manish claims variable “1” is independent of variable “6” given variable “3”.<br>• Trina claims variable “1” is independent of variable “8” given variable “4”.<br><br>Which of the following is true?<\/span><\/div>","o":["Both the students are correct.","Trina is incorrect and Manish is correct.","Trina is correct and Manish is incorrect.","Both the students are incorrect.","Insufficient information to make any conclusion. Probability distributions of each variable should be given."],"a":[2],"m":false,"h":"In an undirected graph, X ⊥ Y | Z if every path from X to Y passes through Z.","e":"Removing 3 doesn't cut every path from 1 to 6, but removing 4 does cut 1 from 8. So Trina is correct and Manish is incorrect."}]},{"w":9,"title":"Week 9 : Assignment 9","practice":false,"qs":[{"q":"Consider the bayesian network shown below.<br><br><img alt=\"\" src=\"https://storage.googleapis.com/swayam-node1-production.appspot.com/assets/img/noc21_cs24/W9A9Q1.png\"><br><br><div>Two students - Manish and Trisha make the following claims:<br><br><\/div><div>• Manish claims \\(P (D|\\{S, L, C\\}) = P (D|\\{L, C\\})\\)<\/div><div>• Trisha claims \\(P (D|\\{S, L\\}) = P (D|L)\\)<br><br><\/div><div>where \\(P (X|Y )\\) denotes probability of event \\(X\\) given \\(Y\\) . Please note that Y can be a set. Which of the following is true?<\/div>","o":["Manish and Trisha are correct.","Manish is correct and Trisha is incorrect.","Manish is incorrect and Trisha is correct.","Both are incorrect.","Insufficient information to make any conclusion. Probability distributions of each variable should be given."],"a":[1],"m":false,"h":"d-separation: given L and C, is every path from D to S blocked? Given only L?","e":"Given {L, C}, all paths from D to S are blocked, so Manish is correct. Given only L, a path through C stays open, so Trisha is incorrect."},{"q":"<div>Consider the same bayesian network shown in previous question (Figure 1). Two other students in the class - Trina and Manish make the following claims:<br><br><\/div><div>• Trina claims P\\( (S|\\{G, C\\}) = P (S|C)\\)<br><\/div><div>• Manish claims \\(P (L|\\{D, G\\}) = P (L|G)\\)<br><br><\/div><div>Which of the following is true?<\/div>","o":["Both the students are correct.","Trina is incorrect and Manish is correct.","Trina is correct and Manish is incorrect.","Both the students are incorrect.","Insufficient information to make any conclusion. Probability distributions of each variable should be given."],"a":[0],"m":false,"h":"Check whether conditioning on C blocks every path S–G, and whether G blocks every path L–D.","e":"Both paths are blocked by the conditioning variables, so both students are correct."},{"q":"Consider the Bayesian graph shown below in Figure 2.<br><br><img alt=\"\" src=\"https://storage.googleapis.com/swayam-node1-production.appspot.com/assets/img/noc21_cs24/W9A9Q3.png\"><br><br><div>The random variables have the following notation: d - Difficulty, i - Intelligence, g - Grade, s -SAT, l - Letter. The random variables are modeled as discrete variables and the corresponding CPDs are as below.<\/div><img alt=\"\" src=\"https://storage.googleapis.com/swayam-node1-production.appspot.com/assets/img/noc21_cs24/W9A9Q3a.png\"><br><img alt=\"\" src=\"https://storage.googleapis.com/swayam-node1-production.appspot.com/assets/img/noc21_cs24/W9A9Q3b.png\"><br>What is the probability of \\(P (i = 1, d = 0, g = 2, s = 1, l = 1)\\)?<br>","o":["0.004608","0.006144","0.001536","0.003992","0.009216","0.007309","None of these"],"a":[4],"m":false,"h":"Multiply P(d)·P(i)·P(g | i, d)·P(s | i)·P(l | g) using the given values.","e":"The product of the five table entries is 0.009216."},{"q":"Using the data given in the previous question, compute the probability of following assignment, \\(P (i = 1, g = 1, s = 1, l = 0)\\) irrespective of the difficulty of the course? (up to 3 decimal places)","o":["0.160","0.371","0.662","0.047","0.037","0.066","0.189"],"a":[3],"m":false,"h":"Marginalise d out: sum the full joint over d = 0 and d = 1.","e":"\\(\\sum_d P(d)P(i{=}1)P(g{=}1|i{=}1,d)P(s{=}1|i{=}1)P(l{=}0|g{=}1) \\approx 0.047\\)."},{"q":"Consider the Bayesian network shown below in Figure 3<br><br><img alt=\"\" src=\"https://storage.googleapis.com/swayam-node1-production.appspot.com/assets/img/noc21_cs24/W9A9Q5.png\"><br><br><div>Two students - Manish and Trisha make the following claims:<br><br><\/div><div>• Manish claims \\(P (H|\\{S, G, J\\}) = P (H|\\{G, J\\})\\)<\/div><div>• Trisha claims \\(P (H|\\{S, C, J\\}) = P (H|\\{C, J\\})\\)<br><br><\/div><div>Which of the following is true?<\/div>","o":["Manish and Trisha are correct.","Both are incorrect.","Manish is incorrect and Trisha is correct.","Manish is correct and Trisha is incorrect.","Insufficient information to make any conclusion. Probability distributions of each variable should be given."],"a":[3],"m":false,"h":"Apply d-separation to each claim: does {G, J} block every path from S to H? Does {C, J}?","e":"{G, J} blocks all paths from S to H, so Manish is correct. {C, J} leaves a path open, so Trisha is incorrect."},{"q":"Consider the Markov network shown below in Figure 4<br><br><img alt=\"\" src=\"https://storage.googleapis.com/swayam-node1-production.appspot.com/assets/img/noc21_cs24/W9A9Q6.png\"><br><br>Which of the following variables are NOT in the markov blanket of variable “4” shown in the above Figure 4 ? (multiple answers may be correct)","o":["1","8","2","5","6","4","7"],"a":[3,5,6],"m":true,"h":"In a Markov network, a node's Markov blanket is just its neighbours. The node itself isn't in its own blanket.","e":"The blanket of 4 is its directly connected neighbours. 5, 4 itself and 7 aren't neighbours, so they're NOT in the blanket."},{"q":"<div>In the Markov network given in Figure 4, two students make the following claims:<br><br><\/div><div>• Manish claims variable “1” is dependent on variable “7” given variable “2”.<\/div><div>• Trina claims variable “2” is independent of variable “6” given variable “3”.<br><br><\/div><div>Which of the following is true?<\/div>","o":["Both the students are correct.","Trina is incorrect and Manish is correct.","Trina is correct and Manish is incorrect.","Both the students are incorrect.","Insufficient information to make any conclusion. Probability distributions of each variable should be given."],"a":[3],"m":false,"h":"Is every path 1 → 7 cut by node 2? Is every path 2 → 6 cut by node 3?","e":"Both claims fail on the graph: 1 and 7 are independent given 2, and 2 and 6 stay connected given 3. Both students are incorrect."},{"q":"Four random variables are known to follow the given factorization<br><br>\\(P (A_1 = a_1 , A_2 = a_2 , A_3 = a_3 , A_4 = a_4 ) = \\frac{1}{Z} ψ_1 (a_1 , a_2 )ψ_2 (a_1 , a_4 )ψ_3 (a_1 , a_3 )ψ_4 (a_2 , a_4 )ψ_5 (a_3 , a_4 )\\)<br><br>The corresponding Markov network would be<br>","o":["<br><img alt=\"\" src=\"https://storage.googleapis.com/swayam-node1-production.appspot.com/assets/img/noc21_cs24/W9A9Q8a.png\"><br>","<br><img alt=\"\" src=\"https://storage.googleapis.com/swayam-node1-production.appspot.com/assets/img/noc21_cs24/W9A9Q8b.png\"><br>","<br><img alt=\"\" src=\"https://storage.googleapis.com/swayam-node1-production.appspot.com/assets/img/noc21_cs24/W9A9Q8c.png\"><br>","<br><img alt=\"\" src=\"https://storage.googleapis.com/swayam-node1-production.appspot.com/assets/img/noc21_cs24/W9A9Q8d.png\"><br>","<br><img alt=\"\" src=\"https://storage.googleapis.com/swayam-node1-production.appspot.com/assets/img/noc21_cs24/W9A9Q8e.png\"><br>"],"a":[2],"m":false,"h":"Each pairwise factor ψ(aᵢ, aⱼ) gives an edge i–j. List the 5 edges and find the graph that has exactly those.","e":"The edges are 1–2, 1–4, 1–3, 2–4 and 3–4 (every pair except 2–3), which matches option C."},{"q":"Does there exist a more compact factorization involving less number of factors for the distribution given in previous question?","o":["Yes","No","Insufficient information"],"a":[0],"m":false,"h":"Factors can be merged over cliques. Which triangles does this graph contain?","e":"Yes. The graph has triangles {1, 2, 4} and {1, 3, 4}, so two clique factors can represent the same distribution."},{"q":"Consider the following Markov Random Field.<br><br><img alt=\"\" src=\"https://storage.googleapis.com/swayam-node1-production.appspot.com/assets/img/noc21_cs24/W9A9Q10.png\"><br><br>Which of the following nodes will have no effect on H given the Markov Blanket of H?<br>","o":["A","B","C","D","E","F","G","H","I","J"],"a":[2,4,5],"m":true,"h":"Given H's Markov blanket (its neighbours), every node outside the blanket is independent of H.","e":"C, E and F aren't neighbours of H, so once the blanket is known they have no effect on H."}]},{"w":10,"title":"Week 10 : Non Graded Assignment","practice":true,"qs":[{"q":"Which among the following is/are some of the assumptions made by the k-means algorithm (assuming Euclidean distance measure)?","o":["Clusters are spherical in shape","Clusters are of similar sizes","Data points in one cluster are well separated from data points of other clusters","There is no wide variation in density among the data points"],"a":[0,1],"m":true,"h":"k-means assigns each point to the nearest centre with plain Euclidean distance. What shape and size does that make each cluster?","e":"k-means implicitly assumes roughly spherical clusters of similar size. It struggles with elongated clusters or clusters of very different sizes."},{"q":"Consider the similarity matrix given below.<br><br><img alt=\"\" src=\"https://storage.googleapis.com/swayam-node1-production.appspot.com/assets/img/noc21_cs24/P10A10Q2.png\"><br><br>Show the hierarchy of clustering created by the single-link clustering algorithm.<br>","o":["<br><img alt=\"\" src=\"https://storage.googleapis.com/swayam-node1-production.appspot.com/assets/img/noc21_cs24/P10A10Q2a.png\"><br>","<br><img alt=\"\" src=\"https://storage.googleapis.com/swayam-node1-production.appspot.com/assets/img/noc21_cs24/P10A10Q2b.png\"><br>","<br><img alt=\"\" src=\"https://storage.googleapis.com/swayam-node1-production.appspot.com/assets/img/noc21_cs24/P10A10Q2c.png\"><br>","<br><img alt=\"\" src=\"https://storage.googleapis.com/swayam-node1-production.appspot.com/assets/img/noc21_cs24/P10A10Q2d.png\"><br>"],"a":[3],"m":false,"h":"Single link: repeatedly merge the two clusters whose most similar pair of points is most similar.","e":"Applying single-link merges to the similarity matrix gives dendrogram D."},{"q":"In the CURE clustering algorithm, representative points of a cluster are moved a fraction of the distance between their original location and the centroid of the cluster. Would it make more sense to move them all a fixed distance towards the centroid instead? Why or why not?","o":["Yes, because this approach will ensure that the original cluster shape is preserved.","No, because this approach will not be as effective against outliers as the original approach."],"a":[1],"m":true,"h":"The representatives are shrunk towards the centroid. An outlier is far away. With a fraction, how far does it move? With a fixed distance?","e":"No. Moving by a fraction pulls distant outliers in much more than near points; a fixed distance would treat them the same and lose that robustness."},{"q":"Suppose while performing DBSCAN we randomly choose a point which has less than MinPts number of points in its neighbourhood. Which among the following is true for such a point?","o":["It is treated as noise, and not considered further in the algorithm","It becomes part of its own cluster","Depending upon other points, it may later turn out to be a core point","Depending upon other points, it may be density connected to other points"],"a":[3],"m":false,"h":"A point with fewer than MinPts neighbours isn't a core point, but could it still be within Eps of a core point?","e":"It may be a border point, density-reachable from some core point, so it can still join a cluster later. It isn't immediately discarded as noise."},{"q":"Consider the following image showing data points belonging to three different clusters (indi- cated by the colours of the points). Which among the following clustering algorithms will perform well in accurately clustering the given data?<br><br><img alt=\"\" src=\"https://storage.googleapis.com/swayam-node1-production.appspot.com/assets/img/noc21_cs24/P10A10Q5.png\"><br>","o":["K-means","Single-link hierarchical","Complete-link hierarchical","DBSCAN"],"a":[3],"m":false,"h":"Look at the cluster shapes: non-convex or of uneven density? Which method follows density instead of distance to a centre?","e":"DBSCAN finds arbitrarily shaped clusters based on density, unlike k-means or complete-link, which assume compact clusters."}]},{"w":10,"title":"Week 10 : Assignment 10","practice":false,"qs":[{"q":"Consider the following one dimensional data set: 12, 22, 2, 3, 33, 27, 5, 16, 6, 31, 20, 37, 8 and 18. Given \\(k = 3\\) and initial cluster centers to be 5, 6 and 31, what are the final cluster centres obtained on applying the k-means algorithm?","o":["5, 18, 30","5, 18, 32","6, 19, 32","4.8, 17.6, 32","None of the above"],"a":[3],"m":false,"h":"Sort the data: 2, 3, 5, 6, 8, 12, 16, 18, 20, 22, 27, 31, 33, 37. Assign each point to the nearest centre, recompute the means, and repeat.","e":"Iterations: (3.33, 12, 28.33) → (4, 14.8, 30) → (4.8, 17.6, 32), after which nothing changes. Final centres: 4.8, 17.6, 32."},{"q":"For the previous question, in how many iterations will the k-means algorithm converge?","o":["2","3","4","6","7"],"a":[2],"m":false,"h":"Count the assignment steps, including the final one that confirms nothing changes.","e":"The centres change 3 times and the 4th iteration confirms convergence: 4 iterations."},{"q":"In the lecture on the BIRCH algorithm, it is stated that using the number of points N, sum of points <b>SUM<\/b> and sum of squared points <b>SS<\/b>, we can determine the centroid and radius of the combination of any two clusters A and B. How do you determine the centroid of the combined cluster? (In terms of <b>N,SUM<\/b> and <b>SS<\/b> of both the clusters)","o":["\\(SU M_A + SU M_B\\)","\\(\\displaystyle \\frac{SU M_A}{N_A} + \\frac{SU M_B}{N_B}\\)","\\(\\displaystyle \\frac{SU M_A +SU M_B}{N_A +N_B}\\)","\\(\\displaystyle \\frac{SS_A +SS_B}{N_A +N_B}\\)"],"a":[2],"m":false,"h":"Centroid = total sum / total count.","e":"\\(\\frac{SUM_A + SUM_B}{N_A + N_B}\\). That's why BIRCH's (N, SUM, SS) features are additive."},{"q":"What assumption does the CURE clustering algorithm make with regards to the shape of the clusters?","o":["No assumption","Spherical","Elliptical"],"a":[0],"m":false,"h":"CURE represents each cluster with several scattered points instead of one centroid. Why?","e":"So that it can capture arbitrary shapes: CURE makes no shape assumption."},{"q":"What would be the effect of increasing MinPts in DBSCAN while retaining the same Eps parameter? (Note that more than one statement may be correct)","o":["Increase in the sizes of individual clusters","Decrease in the sizes of individual clusters","Increase in the number of clusters","Decrease in the number of clusters"],"a":[1,2],"m":true,"h":"With a higher MinPts, fewer points qualify as core points. What happens to clusters held together by thin chains?","e":"Clusters shrink (more points become noise) and some split apart, so individual clusters get smaller and their number can increase."},{"q":"Visualize the dataset DS1. Which of the following algorithms will be able to recover the true clusters (first check by visual inspection and then write code to see if the result matches to what you expected).","o":["K-means clustering","Single link hierarchical clustering","Complete link hierarchical clustering","Average link hierarchical clustering"],"a":[1],"m":false,"h":"Visualise DS1. Are the clusters non-convex or chained (e.g. rings or moons)? Which linkage follows chains?","e":"Single link follows connected chains of points, so it recovers non-convex clusters that k-means and complete/average link break up."},{"q":"Consider the similarity matrix given below: Which of the following shows the hierarchy of clusters created by the single link clustering algorithm.<br><br><img alt=\"\" src=\"https://storage.googleapis.com/swayam-node1-production.appspot.com/assets/img/noc21_cs24/W10A10Q7.png\">","o":["<br><img alt=\"\" src=\"https://storage.googleapis.com/swayam-node1-production.appspot.com/assets/img/noc21_cs24/W10A10Q7a.png\"><br>","<br><img alt=\"\" src=\"https://storage.googleapis.com/swayam-node1-production.appspot.com/assets/img/noc21_cs24/W10A10Q7b.png\"><br>","<br><img alt=\"\" src=\"https://storage.googleapis.com/swayam-node1-production.appspot.com/assets/img/noc21_cs24/W10A10Q7c.png\"><br>","<br><img alt=\"\" src=\"https://storage.googleapis.com/swayam-node1-production.appspot.com/assets/img/noc21_cs24/W10A10Q7d.png\"><br>"],"a":[1],"m":false,"h":"Single link: merge the pair of clusters with the highest maximum similarity between their members.","e":"Following the single-link merge order on the matrix gives dendrogram B."},{"q":"For the similarity matrix given in the previous question, which of the following shows the hierarchy of clusters created by the complete link clustering algorithm.","o":["<br><img alt=\"\" src=\"https://storage.googleapis.com/swayam-node1-production.appspot.com/assets/img/noc21_cs24/W10A10Q8a.png\"><br>","<br><img alt=\"\" src=\"https://storage.googleapis.com/swayam-node1-production.appspot.com/assets/img/noc21_cs24/W10A10Q8b.png\"><br>","<br><img alt=\"\" src=\"https://storage.googleapis.com/swayam-node1-production.appspot.com/assets/img/noc21_cs24/W10A10Q8c.png\"><br>","<br><img alt=\"\" src=\"https://storage.googleapis.com/swayam-node1-production.appspot.com/assets/img/noc21_cs24/W10A10Q8d.png\"><br>"],"a":[3],"m":false,"h":"Complete link: the similarity between clusters is the minimum pairwise similarity; merge the pair where that value is highest.","e":"The complete-link merge order gives dendrogram D."}]},{"w":11,"title":"Week 11 : Non Graded Assignment","practice":true,"qs":[{"q":"Given n samples \\(x_1 , x_2 , . . . , x_N\\) drawn independently from an Exponential distribution unknown parameter \\(λ\\), find the MLE of \\(λ\\).","o":["\\(\\displaystyle λ_{M LE} = \\sum ^n _{i=1} x_i\\)","\\(\\displaystyle λ_{M LE} = n \\sum ^n _{i=1} x_i\\)","\\(\\displaystyle λ_{M LE} = \\frac{n} {\\sum ^n _{i=1} x_i}\\)","\\(\\displaystyle λ_{M LE} = \\frac{\\sum ^n _{i=1} x_i}{n} \\)","\\(\\displaystyle λ_{M LE} = \\frac{n-1} {\\sum ^n _{i=1} x_i}\\)","\\(\\displaystyle λ_{M LE} = \\frac{\\sum ^n _{i=1} x_i}{n-1} \\)"],"a":[2],"m":false,"h":"Log-likelihood: n log λ − λΣxᵢ. Differentiate and set it to 0.","e":"n/λ − Σxᵢ = 0, so \\(λ = n / \\sum x_i\\)."},{"q":"Suppose we are trying to model a p dimensional Gaussian distribution. What is the actual number of independent parameters that need to be estimated?","o":["\\(2\\)","\\(p\\)","\\(2p\\)","\\(p(p + 1)\\)","\\(p(p + 1)/2\\)","\\(p(p + 3)/2\\)"],"a":[5],"m":false,"h":"Count the mean entries plus the free entries of a symmetric covariance matrix.","e":"p for the mean plus p(p+1)/2 for the covariance = p(p+3)/2."},{"q":"In Gaussian Mixture Models, \\(π_i\\) are the mixing coefficients. Select the correct conditions that the mixing coefficients need to satisfy for a valid GMM model.","o":["\\( −1 ≤ π_i ≤ 1, \\,\\, \\forall i\\)","\\( 0 ≤ π_i ≤ 1, \\,\\, \\forall i\\)","\\( \\sum _i π_i = 1\\)","\\( \\sum _i π_i \\) need not be bounded"],"a":[1,2],"m":true,"h":"The mixing weights are probabilities of picking each component.","e":"Each \\(π_i\\) lies between 0 and 1, and they sum to 1."},{"q":"Expectation-Maximization, or the EM algorithm, consists of two steps - E step and the M-step. Using the following notation, select the correct set of equations used at each step of the algorithm. <br> Notation.<br><div> <b> X<\/b> Known/Given variables/data<\/div><div> <b>Z <\/b>Hidden/Unknown variables<\/div><div> θ Total set of parameters to be learned<\/div><div> θ<sub>k<\/sub> Values of all the parameters after stage k<\/div><div> <b>Q<\/b>(, ) The Q-function as described in the lectures<\/div>","o":["\\(\\displaystyle E - \\mathbb{E} _{Z |X, θ} [log ( Pr(X,Z | θ_m)) ]\\)","\\(\\displaystyle E - \\mathbb{E} _{Z |X, θ_{m-1}} [log ( Pr(X,Z | θ)) ]\\)","\\(\\displaystyle M - argmax_θ \\sum_Z Pr(Z | X, θ_{m-1}) . log(Pr(X,Z | θ))\\)","\\(\\displaystyle M − argmax_θ Q(θ, θ_{m−2} )\\)","\\(\\displaystyle M − argmax_θ Q(θ, θ_{m−1} )\\)"],"a":[1,2,4],"m":true,"h":"The E-step uses the PREVIOUS parameters \\(θ_{m-1}\\) to get the expected complete-data log-likelihood. The M-step maximises it over θ.","e":"E: \\(\\mathbb{E}_{Z|X,θ_{m-1}}[\\log Pr(X,Z|θ)]\\). M: \\(\\arg\\max_θ \\sum_Z Pr(Z|X,θ_{m-1})\\log Pr(X,Z|θ)\\), which is the same as \\(\\arg\\max_θ Q(θ,θ_{m-1})\\)."}]},{"w":11,"title":"Week 11 : Assignment 11","practice":false,"qs":[{"q":"Given \\(n\\) samples \\(x_1 , x_2 , . . . , x_n\\) drawn independently from an Geometric distribution unknown parameter \\(p\\) given by pdf \\(Pr(X = k) = (1 − p)^{k−1}p\\) for \\(k = 1, 2, 3, · · ·\\) , find the MLE of \\(p\\).","o":["\\(p_{MLE}=\\sum^n_{i=1}x_i\\)","\\(p_{MLE}=n\\sum^n_{i=1}x_i\\)","\\(p_{MLE}=\\displaystyle\\frac{n}{\\sum^n_{i=1}x_i}\\)","\\(p_{MLE}=\\displaystyle\\frac{\\sum^n_{i=1}x_i}{n}\\)","\\(p_{MLE}=\\displaystyle\\frac{n-1}{\\sum^n_{i=1}x_i}\\)","\\(p_{MLE}=\\displaystyle\\frac{\\sum^n_{i=1}x_i}{n-1}\\)"],"a":[2],"m":false,"h":"Log-likelihood: n log p + (Σxᵢ − n) log(1 − p). Differentiate.","e":"\\(\\frac{n}{p} - \\frac{\\sum x_i - n}{1-p} = 0\\), so \\(p = n / \\sum x_i\\)."},{"q":"Suppose we are trying to model a \\(p\\) dimensional Gaussian distribution. What is the actual number of independent parameters that need to be estimated in mean and covariance matrix respectively?","o":["\\(1,1\\)","\\(p-1,1\\)","\\(p,p\\)","\\(p,p(p+1)\\)","\\(p, p(p + 1)/2\\)","\\(p, (p + 3)/2\\)","\\(p − 1, p(p + 1)\\)","\\(p − 1, p(p + 1)/2 + 1\\)","\\(p − 1, (p + 3)/2\\)","\\(p, p(p + 1) − 1\\)","\\(p, p(p + 1)/2 − 1\\)","\\(p, (p + 3)/2 − 1\\)","\\(p, p^2\\)","\\(p, p^2 /2\\)","None of these"],"a":[4],"m":false,"h":"Mean: one number per dimension. Covariance: symmetric, so count the upper triangle only.","e":"Mean: p. Covariance: p(p+1)/2."},{"q":"Given \\(n\\) samples \\(x_1 , x_2 , . . . , x_N\\) drawn independently from a Poisson distribution unknown parameter \\(λ\\), find the MLE of \\(λ\\).","o":["\\(λ_{MLE}=\\sum^n_{i=1}x_i\\)","\\(λ_{MLE}=n\\sum^n_{i=1}x_i\\)","\\(λ_{MLE}=\\displaystyle\\frac{n}{\\sum^n_{i=1}x_i}\\)","\\(λ_{MLE}=\\displaystyle\\frac{\\sum^n_{i=1}x_i}{n}\\)","\\(λ_{MLE}=\\displaystyle\\frac{n-1}{\\sum^n_{i=1}x_i}\\)","\\(λ_{MLE}=\\displaystyle\\frac{\\sum^n_{i=1}x_i}{n-1}\\)"],"a":[3],"m":false,"h":"Poisson log-likelihood: Σxᵢ log λ − nλ + const.","e":"\\(\\sum x_i / λ - n = 0\\), so λ = the sample mean."},{"q":"In Gaussian Mixture Models, \\(\\pi_i\\) are the mixing coefficients. Select the correct conditions that the mixing coefficients need to satisfy for a valid GMM model.","o":["\\(-1 \\leq \\pi_i \\leq 1, \\,\\,\\forall i\\)","\\(0 \\leq \\pi_i \\leq 1, \\,\\,\\forall i\\)","\\(\\sum_i \\pi_i=1\\)","\\(\\sum_i \\pi_i\\) need not be bounded"],"a":[1,2],"m":true,"h":"Mixing weights are a probability distribution over components.","e":"0 ≤ \\(π_i\\) ≤ 1 and \\(\\sum_i π_i = 1\\)."},{"q":"Expectation-Maximization, or the EM algorithm, consists of two steps - E step and the M-step. Using the following notation, select the correct set of equations used at each step of the algorithm.<br>Notation.<br><div>\\(\\mathbf{X}\\): Known/Given variables/data<\/div><div>\\(\\mathbf{Z}\\): Hidden/Unknown variables<\/div><div>\\(\\theta\\): Total set of parameters to be learned<\/div><div>\\(\\theta_k\\) : Values of all the parameters after stage \\(k\\)<\/div><div>\\(\\mathbf{Q}(, )\\): The Q-function as described in the lectures<\/div>","o":["\\(\\mathbf{E}\\mbox{-step: } \\mathbb{E}_{\\mathbf{Z}|\\mathbf{X},\\theta} [log(P r(\\mathbf{X}, \\mathbf{Z}|\\theta_m))]\\)","\\(\\mathbf{E}\\mbox{-step: } \\mathbb{E}_{\\mathbf{Z}|\\mathbf{X},\\theta_{m-1}} [log(P r(\\mathbf{X}, \\mathbf{Z}|\\theta))]\\)","\\(\\mathbf{M}\\mbox{-step: } argmax_{\\theta}\\sum_\\mathbf{Z}Pr(\\mathbf{Z}|\\mathbf{X},\\theta_{m-2})\\cdot log(Pr(\\mathbf{X},\\mathbf{Z}|\\theta))\\)","\\(\\mathbf{M}\\mbox{-step: } argmax_{\\theta} \\mathbf{Q}(\\theta,\\theta_{m-1})\\)","\\(\\mathbf{M}\\mbox{-step: } argmax_{\\theta} \\mathbf{Q}(\\theta,\\theta_{m-2})\\)"],"a":[1,3],"m":true,"h":"Check which iteration index each step uses. The E-step conditions on \\(θ_{m-1}\\), the latest estimate, not \\(θ_{m-2}\\).","e":"Correct: the E-step with \\(θ_{m-1}\\) and the M-step \\(\\arg\\max_θ Q(θ, θ_{m-1})\\). The options using \\(θ_{m-2}\\) or \\(θ_m\\) in the wrong place are wrong."}]},{"w":12,"title":"Week 12 : Non Graded Assignment","practice":true,"qs":[{"q":"You have been recruited as a lead engineer by ArrEll corporation which wants to enter the self-driving car market. In the context of the standard Reinforcement Learning framework, what would you classify as the <b>state<\/b> and <b>actions<\/b>? Note that your system does not have access to previous states.","o":["<b>State<\/b>-(Current steering wheel position, Current pedal positions, Current speed) <b>Actions<\/b>-(Turn the wheel, Press pedals)","<b>State<\/b>-(Current steering wheel position, Current pedal positions, Current acceleration) <b>Actions<\/b>-(Turn the wheel, Press pedals)","<b>State<\/b>-(Current steering wheel position, Current pedal positions, Current speed) <b>Actions<\/b>-(Change direction, Change speed)","<b>State<\/b>-(Current steering wheel position, Current pedal positions, Current acceleration) <b>Actions<\/b>-(Change direction, Change speed)"],"a":[0],"m":false,"h":"With no memory of past states, the state must hold everything needed to decide. Actions are what the agent physically does.","e":"State: wheel position, pedal positions and current speed. Actions: turning the wheel and pressing the pedals, the controls the agent actually operates."},{"q":"Which of these classifiers do not require any additional modifications to use them when we have more than 2 classes? (Note that more than one answers could be correct)","o":["Decision Trees","Linear Classifier","Support Vector Machines (SVMs)","k Nearest Neighbors (kNN)"],"a":[0,3],"m":true,"h":"Which classifiers predict the class directly (majority vote or leaf label) instead of drawing one binary boundary?","e":"Decision trees and kNN handle any number of classes natively. Linear classifiers and SVMs need one-vs-rest or one-vs-one setups."},{"q":"You are designing a Reinforcement Learning agent for a racing game. Among the following reward schemes, which one leads to the best performance of the agent?","o":["+5 for reaching the finish line, -1 for going off the road","+5 for reaching the finish line, -0.1 for every second that passes before the agent reaches the finish line","+5 for reaching the finish line, -0.1 for every second that passes before the agent reaches the finish line, +1 for the agent going off the road.","-5 for reaching the finish line, +0.1 for every second that passes before the agent reaches the finish line."],"a":[1],"m":false,"h":"A good reward pushes the agent to finish quickly and stay on the road. Check each scheme for loopholes.","e":"+5 at the finish and −0.1 per second rewards finishing fast. The others either ignore speed, reward leaving the road, or reward being slow."}]},{"w":12,"title":"Week 12 : Assignment 12","practice":false,"qs":[{"q":"Which of the following measure best analyze the performance of a classifier?","o":["Precision","Recall","Accuracy","Time complexity","Depends on the application"],"a":[4],"m":false,"h":"Is one metric always the right one? Think of cancer screening vs spam filtering.","e":"It depends on the application: sometimes recall matters most, sometimes precision, accuracy or speed."},{"q":"As discussed in the lecture, most of the classifiers minimize the empirical risk. Which among the following is an exceptional case?","o":["Perceptron learning algorithm","Artificial Neural Network","Support Vector Machines","both (a) and (b)","None of the above"],"a":[2],"m":false,"h":"Which classifier explicitly maximises the margin rather than only reducing training error?","e":"The SVM minimises structural risk (margin plus hinge loss), not just empirical risk."},{"q":"What do you expect to happen to the variance component of the generalisation error of your model as the size of the training data set increases?","o":["Increase in variance","Decrease in variance","No change in variance error"],"a":[1],"m":false,"h":"More data means the fitted model jumps around less between samples.","e":"Variance decreases as the training set grows."},{"q":"After completing <i>Introduction to Machine Learning <\/i>on NPTEL, you have landed a job as a Data Scientist at YumEll Solutions Inc. Your first assignment as a trainee is to learn a classifier given some data and present insights on it to your manager, who apparently doesn’t seem to have any knowledge on Machine Learning. Which of the following classification models would you pick to best explain the nature of the data and the underlying distribution to your manager?","o":["Linear Models","Support Vector Machines","Decision Trees","Artificial Neural Networks"],"a":[2],"m":false,"h":"Which model can you draw as a flowchart of simple if-then rules?","e":"Decision trees are the most interpretable for a non-technical manager."},{"q":"What happens when your model complexity (such as interaction terms in linear regression, order of polynomial in SVM, etc.) increases?","o":["Model Bias increases","Model Bias decreases","Variance of the model increases","Variance of the model decreases"],"a":[1,2],"m":true,"h":"The usual bias–variance trade-off as complexity grows.","e":"Bias decreases and variance increases."},{"q":"Suppose we want an RL agent to learn to play the game of golf. For training purposes, we make use of a golf simulator program. Assume that the original reward distribution gives a reward of +10 when the golf ball is hit into the hole and -1 for all other transitions. To aid the agent’s learning process, we propose to give an additional reward of +3 whenever the ball is within a 1 metre radius of the hole. Is this additional reward a good idea or not? Why?","o":["Yes. The additional reward will help speed-up learning.","Yes. Getting the ball to within a metre of the hole is like a sub-goal and hence, should be rewarded.","No. The additional reward may actually hinder learning.","No. It violates the idea that a goal must be outside the agent’s direct control."],"a":[2],"m":false,"h":"Could the agent collect +3 again and again by staying near the hole instead of finishing?","e":"The shaped reward can be exploited (hovering near the hole for repeated +3s), so it may hinder learning."},{"q":"You want to toss a fair coin a number of times and obtain the probability of getting heads by taking a simple average. What is the estimated number of times you’ll have to toss the coin to make sure that your estimated probability is within 10% of the actual probability, at least 90% of the time?","o":["400*ln(20)","800*ln(20)","200*ln(20)"],"a":[2],"m":false,"h":"Hoeffding: \\(P(|\\hat p - p| &gt; ε) \\le 2e^{-2nε^2}\\). \"Within 10%\" of p = 0.5 means ε = 0.05; set the bound to 0.1.","e":"\\(2e^{-2n(0.05)^2} \\le 0.1\\) gives \\(n \\ge \\frac{\\ln 20}{0.005} = 200\\ln 20\\)."},{"q":"A new phone, E-Corp X1 has been announced and it is what you’ve been waiting for, all along. You decide to read the reviews before buying it. From past experiences, you’ve figured out that good reviews mean that the product is good 90% of the time and bad reviews mean that it is bad 70% of the time. Upon glancing through the reviews section, you find out that the X1 has been reviewed 1269 times and only 127 of them were bad reviews. What is the probability that, if you order the X1, it is a bad phone?","o":["0.1362","0.160","0.840","0.773"],"a":[1],"m":false,"h":"Same as the Week 1 version, but now with 127 bad reviews: total probability over good and bad reviews.","e":"0.7(127/1269) + 0.1(1142/1269) ≈ 0.070 + 0.090 = 0.160."},{"q":"You face a particularly challenging RL problem, where the reward distribution keeps changing with time. In order to gain maximum reward in this scenario, does it make sense to stop exploration or continue exploration?","o":["Stop exploration","Continue exploration"],"a":[1],"m":false,"h":"If the rewards keep changing, can old estimates be trusted forever?","e":"Keep exploring: in a non-stationary problem the best action can change, so you have to keep sampling the alternatives."}]}];

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sameSet = (a, b) => a.length === b.length && a.every(x => b.includes(x));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const grade3 = p => p >= .8 ? 'good' : p >= .5 ? 'mid' : 'bad';
const gradeColor = p => p >= .8 ? 'var(--green)' : p >= .5 ? 'var(--orange)' : 'var(--red)';
const typeset = el => { if (window.renderMathInElement) { try { renderMathInElement(el, { delimiters: [{ left: '\\[', right: '\\]', display: true }, { left: '\\(', right: '\\)', display: false }], throwOnError: false, strict: 'ignore' }); } catch (e) {} } };
const plain = h => { const d = document.createElement('div'); d.innerHTML = h; return d.textContent.replace(/\s+/g, ' ').trim(); };

function score(s) {
  let done = 0, ok = 0;
  for (const q of s.qs) { const r = store.ans[q.id]; if (r) { done++; if (r.ok) ok++; } }
  return { done, ok, total: s.qs.length };
}
function bigRing(frac, color, label, sub) {
  const r = 40, c = 2 * Math.PI * r;
  return `<svg class="big-ring" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--fill2)" stroke-width="11"/>${frac > 0 ? `<circle cx="50" cy="50" r="${r}" fill="none" stroke="${color}" stroke-width="11" stroke-linecap="round" stroke-dasharray="${frac * c} ${c}" transform="rotate(-90 50 50)"/>` : ''}<text x="50" y="${sub ? 52 : 57}" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" font-size="${label.length > 3 ? 20 : 23}" fill="var(--label)">${label}</text>${sub ? `<text x="50" y="68" text-anchor="middle" font-family="Figtree, sans-serif" font-weight="600" font-size="10.5" fill="var(--label2)">${sub}</text>` : ''}</svg>`;
}

function renderHome() {
  session = null;
  const ids = Object.keys(store.ans).filter(id => BYID[id]);
  const done = ids.length, ok = ids.filter(id => store.ans[id].ok).length;
  const wrongIds = ids.filter(id => !store.ans[id].ok);
  const gradedTotal = GRADED.reduce((n, s) => n + s.qs.length, 0);
  const acc = done ? ok / done : 0;

  const weekCard = ({ w, graded, practice }) => {
    const c = WCOL[w % WCOL.length];

    const main = graded || practice;
    const sc = score(main);
    const barW = sc.done / sc.total * 100;
    const chip = (s, primary, label) => {
      const k = score(s);
      const meta = k.done ? `<span class="meta ${grade3(k.ok / k.done)}">${k.ok}/${k.total}</span>` : `<span class="meta">${k.total} Qs</span>`;
      return `<button class="chip ${primary ? 'primary' : ''}" data-set="${s.i}"><span>${label}</span>${meta}</button>`;
    };
    return `<article class="wk" style="--c:${c}">
      <div class="wk-top"><span class="wk-num">${w}</span><div style="min-width:0"><div class="wk-label">Week ${w}</div><h3>${head}</h3></div></div>
      <p class="wk-sub">${sub}</p>
      <div class="wk-bar" title="${sc.done} of ${sc.total} answered"><i style="width:${barW}%;background:${sc.done ? gradeColor(sc.ok / sc.done) : 'transparent'}"></i></div>
      <div class="wk-actions">${graded ? chip(graded, true, 'Assignment') : ''}${practice ? chip(practice, !graded, graded ? 'Practice' : 'Practice set') : ''}</div>
    </article>`;
  };

  app.innerHTML = `
  <div class="wrap home fade">
    <header class="hero">
      <div><div class="eyebrow">NPTEL · Introduction to ML</div><h1>ML Revision</h1></div>
      <span class="course-tag">noc26_cs133</span>
    </header>

    <section class="summary">
      ${bigRing(done / ALLQ.length, 'var(--blue)', Math.round(done / ALLQ.length * 100) + '%', 'done')}
      <div class="summary-main">
        <div class="summary-title">${done ? (done === ALLQ.length ? 'Every question attempted' : 'Keep going') : 'Ready when you are'}</div>
        <div class="summary-sub">${done ? `${done} of ${ALLQ.length} questions answered` : `${ALLQ.length} questions across 13 weeks, with official answers`}</div>
        <div class="metrics">
          <div class="metric"><b class="num" style="color:${done ? gradeColor(acc) : 'var(--label)'}">${done ? Math.round(acc * 100) + '%' : '–'}</b><span>Accuracy</span></div>
          <div class="metric"><b class="num" style="color:var(--green)">${ok}</b><span>Correct</span></div>
          <div class="metric"><b class="num" style="color:${wrongIds.length ? 'var(--red)' : 'var(--label)'}">${wrongIds.length}</b><span>To review</span></div>
        </div>
      </div>
    </section>

    <div class="tiles">
      <button class="tile" data-act="mock"><span class="ic" style="background:var(--indigo)">${I.stack}</span><span><b>Mock test</b><small>All ${gradedTotal} graded, shuffled</small></span></button>
      <button class="tile" data-act="quick"><span class="ic" style="background:var(--orange)">${I.bolt}</span><span><b>Quick 20</b><small>Random graded mix</small></span></button>
      <button class="tile" data-act="mistakes" ${wrongIds.length ? '' : 'disabled'}><span class="ic" style="background:var(--red)">${I.redo}</span>${wrongIds.length ? `<span class="corner num" style="color:var(--red)">${wrongIds.length}</span>` : ''}<span><b>Mistakes</b><small>${wrongIds.length ? 'Retry what you missed' : 'None yet'}</small></span></button>

  app.querySelectorAll('[data-set]').forEach(b => b.onclick = () => {

/* ---------------- quiz ---------------- */
function start(title, subtitle, ids, mixed) {
  session = { title, subtitle, ids, mixed, idx: 0, res: {}, seen: {}, sel: [], revealed: false };
  history.pushState({ v: 'quiz' }, '');
  renderQuiz();
  window.scrollTo(0, 0);
}

function stripHtml(s) {
  if (s.ids.length > 48) {
    const n = s.ids.length, ok = s.ids.filter(id => s.res[id]?.ok).length, no = s.ids.filter(id => s.res[id] && !s.res[id].ok).length;
    return `<div class="linebar" title="${ok} right, ${no} wrong"><i style="width:${ok / n * 100}%;background:var(--green)"></i><i style="width:${no / n * 100}%;background:var(--red)"></i></div>`;
  }
  return `<div class="strip">${s.ids.map((id, i) => {
    const r = s.res[id];
    const cls = i === s.idx ? 'cur' : r ? (r.ok ? 'ok' : 'no') : s.seen[id] ? 'seen' : '';
    return `<button class="${cls}" data-go="${i}" aria-label="Question ${i + 1}"></button>`;
  }).join('')}</div>`;
}

function renderQuiz() {
  const s = session, q = BYID[s.ids[s.idx]], set = SETS[q.set];
  const prior = s.res[q.id];
  if (prior) { s.sel = prior.sel.slice(); s.revealed = true; }
  else if (store.study) s.revealed = true;
  const multi = q.m || q.a.length > 1;
  const last = s.idx === s.ids.length - 1;
  const graded = !!prior;

  const optHtml = q.o.map((o, k) => {
    let cls = 'opt' + (multi ? ' multi' : ''), mark = '';
    const isAns = q.a.includes(k), isSel = s.sel.includes(k);
    if (s.revealed) {
      if (isAns && isSel) { cls += ' right'; mark = `<span class="mark" style="color:var(--green)">${I.checkC}</span>`; }
      else if (isSel) { cls += ' wrong'; mark = `<span class="mark" style="color:var(--red)">${I.crossC}</span>`; }
      else if (isAns) { cls += graded ? ' missed' : ' right'; mark = `<span class="mark" style="color:var(--green)">${I.checkC}</span>`; }
      else cls += ' dim';
    } else if (isSel) cls += ' sel';
    return `<button class="${cls}" data-k="${k}" ${s.revealed ? 'disabled' : ''} aria-pressed="${isSel}"><span class="key">${LETTERS[k]}</span><span class="body">${o || '<i style="color:var(--label3)">(blank)</i>'}</span>${mark}</button>`;
  }).join('');

  const ansText = q.a.map(k => LETTERS[k]).join(', ');
  let fb = '';
  if (s.revealed) {
    if (prior && prior.ok) fb = `<div class="feedback ok"><span class="fi">${I.check}</span><div><b>Correct</b><span>${multi ? 'You got every right option.' : 'Nice one.'}</span></div></div>`;
    else if (prior) fb = `<div class="feedback no"><span class="fi">${I.cross}</span><div><b>Not quite</b><span>Correct answer${q.a.length > 1 ? 's' : ''}: <strong style="color:var(--label)">${ansText}</strong></span></div></div>`;
    else fb = `<div class="feedback key"><span class="fi">${I.eye}</span><div><b>Answer: ${ansText}</b><span>${store.study ? 'Study mode is on' : 'Revealed without answering'}</span></div></div>`;
  }

  let label, act, disabled = false, green = false;
  if (!s.revealed && multi) { label = 'Check answer'; act = 'check'; disabled = !s.sel.length; }
  else if (!s.revealed) { label = last ? 'See results' : 'Skip'; act = last ? 'finish' : 'next'; }
  else { label = last ? 'See results' : 'Next question'; act = last ? 'finish' : 'next'; green = !!(prior && prior.ok); }

  const answered = Object.keys(s.res).length;
  // Only animate what is new: a new question, a just-revealed answer, a just-opened hint.
  const fresh = s.lastId !== q.id;
  const newReveal = s.revealed && (fresh || !s.lastRevealed);
  const newHint = s.hint && (fresh || !s.lastHint);
  const keep = fresh ? {} : { qcard: app.querySelector('.qcard'), hintbox: app.querySelector('.hintbox') };
  app.innerHTML = `
  <nav class="nav"><div class="nav-in">
    <button class="nav-btn" data-act="back">${I.back}<span>Home</span></button>
    <div class="nav-title"><b>${esc(s.title)}</b><small>${esc(s.subtitle || '')}</small></div>
    <div class="nav-right">${answered ? '<button class="nav-btn" data-act="finish" style="font-weight:600">Finish</button>' : ''}</div>
  </div></nav>
  <div class="wrap quiz">
    ${stripHtml(s)}
    <div class="qhead">
      <span class="qno num">Question ${s.idx + 1} <span>/ ${s.ids.length}</span></span>
      ${s.mixed ? `<span class="pill">Week ${set.w}${set.practice ? ' practice' : ''} · Q${q.n}</span>` : ''}
      ${multi ? `<span class="pill multi">${I.check} Select all that apply</span>` : ''}
    </div>
    <div class="qcard${fresh ? ' fade' : ''}">${q.q}</div>
    <div class="side"><div class="opts">${optHtml}</div>
    ${fb}
    ${s.revealed && q.e ? `<div class="explain${newReveal ? ' fade' : ''}"><div class="ex-h">${I.bulb}Why this is the answer</div><div class="ex-b">${q.e}</div>${q.h ? `<div class="ex-hint"><b>Hint</b> ${q.h}</div>` : ''}</div>` : ''}
    ${!s.revealed && s.hint && q.h ? `<div class="hintbox${newHint ? ' fade' : ''}"><div class="ex-h">${I.bulb}Hint</div><div class="ex-b">${q.h}</div></div>` : ''}
    ${!s.revealed ? `<div class="tools">${q.h ? `<button class="reveal" data-act="hint">${I.bulb}${s.hint ? 'Hide hint' : 'Get a hint'}</button>` : ''}<button class="reveal" data-act="reveal">${I.eye}Show answer</button></div>` : ''}
    </div>
    <div class="hint"><span class="kbd">1</span>–<span class="kbd">9</span> choose · <span class="kbd">Enter</span> check / next · <span class="kbd">←</span> <span class="kbd">→</span> move · <span class="kbd">Esc</span> home</div>
  </div>
  <div class="actionbar"><div class="actionbar-in">
    <button class="btn icon" data-act="prev" ${s.idx === 0 ? 'disabled' : ''} aria-label="Previous question">${I.back.replace('<svg', '<svg style="width:10px;height:17px"')}</button>
    <button class="btn primary ${green ? 'go-green' : ''}" data-act="${act}" id="primary" ${disabled ? 'disabled' : ''}>${label}${act === 'next' ? I.next : ''}</button>
  </div></div>`;

  for (const [cls, node] of Object.entries(keep)) { const fresh_ = app.querySelector('.' + cls); if (node && fresh_) { node.classList.remove('fade'); fresh_.replaceWith(node); } }
  if (!newReveal) app.querySelectorAll('.feedback').forEach(f => f.style.animation = 'none');
  s.lastId = q.id; s.lastRevealed = s.revealed; s.lastHint = s.hint;
  s.seen[q.id] = true;
  typeset(app);
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => choose(+b.dataset.k));
  app.querySelectorAll('[data-act]').forEach(b => b.onclick = () => act_(b.dataset.act));
  app.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(+b.dataset.go));
}

function choose(k) {
  const s = session; if (!s || s.revealed) return;
  const q = BYID[s.ids[s.idx]];
  if (k >= q.o.length) return;
  if (q.m || q.a.length > 1) { s.sel = s.sel.includes(k) ? s.sel.filter(x => x !== k) : [...s.sel, k]; renderQuiz(); }
  else { s.sel = [k]; grade(); }
}
function grade() {
  const s = session, q = BYID[s.ids[s.idx]];
  const ok = sameSet(s.sel, q.a);
  s.res[q.id] = { sel: s.sel.slice(), ok };
  store.ans[q.id] = { ok, t: Date.now() }; save();
  s.revealed = true; renderQuiz();
}
function go(i) {
  const s = session; if (!s || i < 0 || i >= s.ids.length) return;
  s.idx = i; s.sel = []; s.revealed = false; s.hint = false; renderQuiz(); window.scrollTo(0, 0);
}
function act_(a) {
  const s = session;
  if (a === 'back') return history.back();
  if (a === 'prev') go(s.idx - 1);
  if (a === 'next') go(s.idx + 1);
  if (a === 'check' && s.sel.length) grade();
  if (a === 'reveal') { s.revealed = true; renderQuiz(); }
  if (a === 'hint') { s.hint = !s.hint; renderQuiz(); }
  if (a === 'finish') renderResults();
}

/* ---------------- results ---------------- */
function renderResults() {
  const s = session;
  const ids = Object.keys(s.res);
  const ok = ids.filter(id => s.res[id].ok).length;
  const wrong = ids.filter(id => !s.res[id].ok);
  const skipped = s.ids.length - ids.length;
  const pct = ids.length ? ok / ids.length : 0;
  const msg = !ids.length ? 'You didn’t answer any questions this time.' : pct >= .8 ? 'Strong result. This topic looks exam-ready.' : pct >= .5 ? 'Solid base. Go over the misses once more.' : 'Worth another pass before the exam.';
  const r = 62, c = 2 * Math.PI * r;
  app.innerHTML = `
  <nav class="nav"><div class="nav-in">
    <button class="nav-btn" data-act="home">${I.back}<span>Home</span></button>
    <div class="nav-title"><b>Results</b><small>${esc(s.title)}</small></div><div></div>
  </div></nav>
  <div class="wrap fade">
    <div class="result">
      <svg viewBox="0 0 150 150" aria-hidden="true"><circle cx="75" cy="75" r="${r}" fill="none" stroke="var(--fill2)" stroke-width="14"/>${pct > 0 ? `<circle cx="75" cy="75" r="${r}" fill="none" stroke="${gradeColor(pct)}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${pct * c} ${c}" transform="rotate(-90 75 75)"/>` : ''}<text x="75" y="84" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" font-size="32" fill="var(--label)">${Math.round(pct * 100)}%</text></svg>
      <h2>${ok} of ${ids.length} correct</h2>
      <p>${msg}</p>
      <div class="tally">
        <span style="background:var(--green-bg);color:var(--green)">${ok} right</span>
        <span style="background:var(--red-bg);color:var(--red)">${wrong.length} wrong</span>
        ${skipped ? `<span style="background:var(--fill);color:var(--label2)">${skipped} skipped</span>` : ''}
      </div>
    </div>
    <div class="stack">
      ${wrong.length ? `<button class="btn primary" data-act="retry">${I.redo.replace('<svg', '<svg style="width:18px;height:18px"')}Retry the ${wrong.length} I missed</button>` : ''}
      <button class="btn secondary" data-act="again">Start this set again</button>
    </div>
    ${wrong.length ? `<div class="sec-h"><h2>Missed</h2><span>Tap to revisit</span></div>${wrong.map(id => { const q = BYID[id], set = SETS[q.set], col = WCOL[set.w % WCOL.length]; return `<button class="miss" data-jump="${id}" style="--c:${col}"><span class="wk-num">${set.w}</span><span class="t"><b>Week ${set.w}${set.practice ? ' practice' : ''} · Q${q.n}</b><span>${esc(plain(q.q).slice(0, 140))}</span></span>${I.chev}</button>`; }).join('')}` : ''}
  </div>`;
  app.querySelector('[data-act=home]').onclick = () => history.back();
  const rt = app.querySelector('[data-act=retry]');
  if (rt) rt.onclick = () => { session = { title: 'Retry', subtitle: s.title, ids: wrong, mixed: true, idx: 0, res: {}, seen: {}, sel: [], revealed: false }; renderQuiz(); window.scrollTo(0, 0); };
  app.querySelector('[data-act=again]').onclick = () => { session = { ...s, idx: 0, res: {}, seen: {}, sel: [], revealed: false, ids: s.mixed ? shuffle(s.ids) : s.ids }; renderQuiz(); window.scrollTo(0, 0); };
  app.querySelectorAll('[data-jump]').forEach(b => b.onclick = () => go(s.ids.indexOf(b.dataset.jump)));
  window.scrollTo(0, 0);
}

window.addEventListener('popstate', () => { if (session) renderHome(); });
document.addEventListener('keydown', e => {
  if (!session || e.metaKey || e.ctrlKey || e.altKey) return;
  const p = document.getElementById('primary');
  if (!p) { if (e.key === 'Escape') history.back(); return; }
  if (/^[1-9]$/.test(e.key)) choose(+e.key - 1);
  else if (e.key.length === 1 && /[a-p]/i.test(e.key)) choose(LETTERS.indexOf(e.key.toUpperCase()));
  else if (e.key === 'Enter') { if (!p.disabled) { e.preventDefault(); p.click(); } }
  else if (e.key === 'ArrowRight') go(session.idx + 1);
  else if (e.key === 'ArrowLeft') go(session.idx - 1);
  else if (e.key === 'Escape') history.back();
});

history.replaceState({ v: 'home' }, '');
renderHome();
</script>
</body>
</html>
